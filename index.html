ことが明らかになっている。また、将来の歯周病発症につながることが予想される歯肉炎、歯列・咬合・顎関節、口腔習癖、咀嚼などの口腔機能発達不全等、さまざまな問題を抱える子供たちも認められる。"],["p","歯・口の健康に対する正しい理解と口腔清掃習慣の育成は、学校での歯科保健教育に加え、家庭での実践が定着することでより効果が上がることから、保護者に対して健康的な生活習慣や食生活に努めるよう啓発し、協力を求める必要がある。"],["p","また、学校歯科健診では、う蝕についてのCO（要観察歯）、歯肉炎についてのGO（歯周疾患要観察者）といった大きな特色を持った診断基準がある。COやGOの状態はう蝕や歯周病の極めて初期の状態を指し、この状態に気づき、口の中の環境を改善できれば進行を遅らせたり、健康な状態まで回復させることも可能と考えられている。そのため、こうした診断に基づき、児童・生徒が自分自身で手鏡を持ち、自分の歯と口の問題点を把握して適切なケアを行うようになれば、学校歯科保健教育の絶好のアクティブ・ラーニング素材と捉えられる。"],["p","現在、学校内での歯科保健教育は、児童・生徒の教育指導に当たる教員に委ねられており、必ずしも十分であるとは言えない。学校歯科医が歯科的な健康教育に関わるためには本来、校長、養護教諭、担任をはじめとする学校関係者との連携を密にして、互いに理解し合っていることが欠かせないものの、実際には協力体制が整っているところは数少ない。"],["p","片や学校歯科医側も治療中心の考え方で、学校歯科保健を担当しているケースが往々にしてある。学校歯科医は単に定期歯科健康診断を実施して終わりではなく、担当する学校の歯科保健教育に真に必要なことは何かを探って、教員らにアドバイスしていくことが欠かせない。"],["p","日本における児童う蝕の有病状況は年々改善傾向にあるものの、現在でもう蝕の有病者率やDMFT（一人平均う蝕経験歯数）には地域格差がみられる。う蝕を減らすためには、学校でのフッ化物洗口が公衆衛生学的に極めて有効な手段であることは歯科関係者には明白であるが、学校現場では、養護教諭をはじめ保護者から反対の声もいまだに聞くことが多い。こうした問題への対応として、う蝕予防のためのフッ化物応用に関する正しい知識を、学校歯科保健教育を通じて広める必要がある。"],["p","また、この先、生産人口の著しい低下により、今まで以上に働き手の確保のために世界各国からの外国人移住が増加するとみられている。こうした外国人の子供達が日本の学校教育を受ける機会も増加することが見込まれるため、外国籍の保護者に、日本の学校歯科保健活動を理解してもらうことも欠かせない。"],["p","現在、政府が進めているデジタル革命やイノベーションにより社会が抱えるさまざまな課題の解決を試みるSociety 5.0時代を迎える中、学校歯科教育の場面にICT（情報通信技術）の活用もぜひ進めたい。ICTの利用により、学校歯科健康診断の際にノートパソコンやタブレット型端末を使って直接、児童・生徒に自分自身の歯と口の状態を確認してもらったり、問題点を指摘したりすることが今や可能になり始めている。それらの普及が進めば、よりきめ細かな歯科保健指導につながる上、健康診断時のデータがデジタル化されるので、疫学的分析も簡便になるメリットがある。"],["p","その実現に当たっては、ICTを利用した歯科保健教育を普及させるための学習プログラムやツール等の開発が望まれる。開発に際しては、文部科学省と厚生労働省の緊密な連携が重要だが、加えて歯科界の統一した見解が反映できるように日本学校歯科医会、日本歯科医学会、日本歯科医師会がより一層連携をとり、対応していくべきだろう。"],["p","なお、Society 5.0時代が本格化すれば、学校歯科教育に学校歯科医のみならず、地域のかかりつけ歯科医や大学関係者等が容易に参加することも可能となり、教育プログラムの多様性が増すと考えられる。"],["p","このほか、学校歯科医の配置対象を大学、専門学校等まで拡充することが望まれる。現在の学校保健安全法では、高等学校までの歯科保健管理が義務化されているが、専門学校や大学、大学院に通学する生徒、さまざまな理由で不登校になりフリースクール等に通う若年層の歯科健康管理は自己責任となっている。現状、成人歯科健診制度の整備されていない中で、18歳から20歳代前半までの年齢層を学校歯科医が主体となって口腔健康管理を行うことは重要と考える（33ページ参照）。"],["li","学校教育現場との連携によるフッ化物洗口の全国展開"],["li","外国籍の子どもや保護者に対する日本の学校歯科保健活動への理解の促進"],["li","学校歯科教育場面でのICT活用の推進とその実践に向けた学習プログラムやツールへの開発協力"],["li","学校歯科医制度の拡充に向けた働きかけの強化"]]},{"title":"4）より良く食べるための支援の拡充","blocks":[["p","「食べることは生きること、生きることは食べること」という言葉があるが、口からしっかり栄養を取ることは健康長寿の秘訣とされる。加えて、口から食べることは元気の源となるものであり、生きる喜びにもつながる。一生楽しい食生活を送れるようにするためには、生涯にわたって歯・口の健康に根ざした食べ方からの食育推進が極めて重要で、口腔の専門家として歯科医が果たすべき役割は大きい。"],["p","食べ方を通した食育支援のあり方は、小児期・成人期・高齢期などのライフステージによって異なる。"],["p","成人期の食の問題は、青年期（19〜39歳）と壮年期（40〜64歳）に大別して考える必要がある。青年期における食の問題点としては朝食の欠食がある。朝食の欠食は男女ともに20代を中心に多く見られる。また、若い世代では主食・主菜・副菜を組み合わせた食事を1日2回以上食べる者の割合が低く、外食、持ち帰りの弁当や総菜といった中食、ファストフードを定期的に利用している者の割合が高くなっている。この年代には1日の食事のリズムから健やかな生活リズムが構築されることを理解してもらい、朝食の欠食を避けてもらうほか、中食や外食を利用しても、栄養バランスの良い食事、自分にあった食事量を取るよう指導し、実践してもらう必要がある。さらに、従業員の健康の維持・増進や生活習慣病予防という目的から健康に配慮した献立を用意する社員食堂等も積極的に利用するよう促したい。"],["p","壮年期は、社会や家庭において重要な役割を担う時期となる。仕事上での責任が重くなる管理職など精神的ストレスも加わりやすく、自分自身の健康に注意を払うことも疎かになりがちである。また、仕事上の飲食が増えて食べ過ぎたり、運動不足が続いたりすると、高血糖、脂質異常、高血圧につながり、メタボリックシンドロームとなり、心疾患、脳血管障害などのリスクが高まっていく。こうしたことから、生活習慣病予防を念頭においた食習慣、生活習慣、運動習慣の見直しが重要である。"],["p","最期まで自分の口から食べることを目指すには、正しい知識を持つこと、そして、それ以前に食の問題に関心を持つことが大切である。こうした食事に関する教育は、これまで食育に関して主体的な役割を担ってきた管理栄養士などの関係職種とも適宜連携しながら、展開していく。"],["p","また、近年、不規則な食生活や栄養バランスを欠いた食事は歯周病を進行させる要因になることが明らかになってきており、そのエビデンスの構築にも努める。"],["p","歯周病は青年期のころから少しずつ進むが、silent diseaseとも呼ばれるように、ひどくなるまで自覚症状がないことが多い。現在、成人期の歯科健診が法定健診ではないため、歯と口の健康のために年に一度はかかりつけ歯科医による定期歯科健診を受けること、ならびに乱れた食習慣の見直しの必要性を十分理解してもらうことはとても大切であり、そのための普及啓発を図る。"],["p","壮年期になると、歯周病の自覚症状も感じるようになる。歯周病は糖尿病をはじめ、 脳血管障害や心臓疾患など様々な病気との関連性が指摘されているため、こうした病気の予防のために歯周病の重症化予防を意識した歯科保健指導が重要である。40歳からは健康増進法に基づく歯周疾患検診が各自治体で実施されているので、壮年期にはこうした歯周疾患検診の機会について、積極的な利用を促していく。"],["li","日本栄養士会をはじめとする関係団体と適宜連携しながらの食べ方支援の推進"],["li","食習慣と歯周病との関連に係るエビデンスの構築【2030年まで】"],["li","労働安全衛生法の改正による職域における歯科健診の導入に向けた働きかけ"]]}]},{"title":"柱5　多様なニーズに応え社会貢献を果たす","items":[{"title":"1）スポーツ歯科への取り組みの拡充","blocks":[["p","世界的にも最も進んだ健康長寿社会を誇る我が国では老若男女がさまざまなスポーツを愛好している。しかし、マウスガード等によりスポーツ外傷を防ぐことや、スポーツのパフォーマンスと噛み合わせの関係等は、未だ国民に広く周知されてはいない。"],["p","スポーツ医学にやや遅れをとったものの、1990（平成2）年のソウルオリンピックを契機に、内科と整形外科に義務づけられていた日本人選手のメディカルチェックの項目に、歯科が加わった。その後、スポーツ歯科に関する社会の認知度が徐々に高まり、2011（平成23）年に制定されたスポーツ基本法では、「スポーツに関する科学的研究の推進」の項に「歯学」が初めて入り、さらに2012（平成24）年の文科省スポーツ基本計画の中に「マウスガード着用の効果の普及啓発」などが明記された。加えて日本歯科医師会では2013（平成25）年より、我が国の各競技団体及び各都道府県の体育協会を統括する公益財団法人日本体育協会（現日本スポーツ協会）との協働で、公認スポーツデンティストの養成を実施している。"],["p","スポーツ歯科の役割には、「歯や口のケガの防止」「歯科的な健康管理」「競技能力の向上」等があるが、特に口腔外傷の予防によるスポーツの安全性確保が第一義である。また歯の状態が悪くて、しっかり食べられなければ、栄養の吸収がうまくいかず、アスリートやスポーツ愛好者が本来のパフォーマンスが発揮しにくくなることは明らかである。さらに研究の余地はあるものの、噛み合わせを安定させることで、握力や背筋力等、身体の収縮する筋力が増大し、結果的に競技力の向上につながると考えられている。また、上下の歯の接触面積が大きいほど身体の重心の揺れが少ない、すなわち軸がぶれないこと等も、明らかになってきた。これは、基礎体力が衰えた高齢者が、歯の欠損部位に義歯を装着することにより、転倒を防止する効果等にもつながるものである。"],["p","歯科と全身の健康等に関するエビデンスレベルが高まる中で、スポーツ歯科分野における研究開発の実績等に関する情報を整理し、歯科医師会広報の主要コンテンツとして位置づけ、広く普及に努める。加えて、FDI（国際歯科連盟）のスポーツタスクチームに協力するとともに、スポーツ歯学に関する国際的な情報を内外に提示していく。"],["p","特に、スポーツマウスガードの装着及びメインテンスの重要性については、文部科学省スポーツ基本計画の下に、ジュニア世代や小中学校におけるクラブ活動の指導者や各競技団体の関係者を対象とした研修会を開催する等の対策を講ずることで、スポーツ現場におけるマウスガードの普及定着を図る。"],["p","今後はさらに、歯科から国民スポーツを下支えする観点からも、コンタクトスポーツを中心としてマウスガード装着をルール化する競技種目の拡充、国民体育大会等のスポーツ祭典の競技会場における歯科医師臨場の推進、各競技団体との新たな連携構築、スポーツ歯科分野の研究開発及び人材育成等に取り組んでいく。その実現のためには、文部科学省、厚生労働省、日本スポーツ協会及び公認スポーツデンティスト協議会、日本スポーツ歯科医学会、日本学校歯科医会等との連携強化が不可欠である。"],["li","小中学校等におけるスポーツ指導者への研修の充実【2025年まで】"],["li","国民体育大会等のスポーツ祭典競技会場における歯科医師臨場の推進"],["li","各競技団体におけるスポーツ歯科の普及啓発"],["li","スポーツ歯科分野における研究開発の推進"]]},{"title":"2）災害時歯科対応の徹底・充実","blocks":[["p","日本歯科医師会の組織的な災害対応は、1985（昭和60）年の日本航空機墜落事故における身元確認作業等が端緒である。530名もの身元確認作業を2週間余で実施した群馬県歯科医師会および大学関係者等の献身的な働きが、国民へ広く周知された。またこの経験は、2011（平成23）年の東日本大震災でも活かされ、発災当初の約4か月間で、延べ2,600名の歯科医師が約9千体の歯科所見を採取したことは、過去の歴史にない程の社会貢献であり、身元確認における歯科所見の有用性が再認識された。"],["p","また日本歯科医師会は、災害歯科コーディネーターの養成や、「大規模災害時の歯科医師会行動計画（「身元確認マニュアルを含む）」、「事業継続計画（BCP）＜大規模災害時編＞」「大規模災害時における役職員の行動マニュアル」の策定等を実施し、さらに関東圏の7都県歯科医師会とそれぞれの、歯科医師会館等の災害時の施設利用に関する相互協定を締結している。"],["p","大規模災害時における被災者健康支援のためには、緊急性が高い歯科医療提供、避難所・仮設住宅等における口腔健康管理、とりわけ誤嚥性肺炎の予防による震災関連死の防止は極めて重要であり、近年では関係者の尽力により、肺炎による震災関連死者数が減少しているとみられる。"],["p","このように災害への対応は多岐にわたるが、国が進める国土強靭化や防災・減災対策と併せ、これまで得た知見からは、将来起こりうる大規模災害への備えも重要である。"],["p","災害時の歯科ニーズは刻々と変化し、フェーズ1では、顎顔面の外傷等に対する口腔外科領域の処置が中心で病院の歯科・口腔外科が主体となる。フェーズ2では、応急的な歯科治療、以前からの治療の継続、健康支援のための口腔健康管理が主課題となる。フェーズ3では、中長期的な健康支援のための、巡回や訪問による口腔ケア、あるいは義歯治療等があるが、他の医療救護班や保健師等の他職種との連携が不可欠であり、再開した歯科医療機関への円滑な移行も視野に入れての対応となる。"],["p","近年では、台風など大規模な自然災害が続いているが、短期的に集中して発生する暴風雨や、それに伴う河川の氾濫、また長期間の停電や断水など、新たな対策が求められている。さらに多くの特別養護老人ホームや、介護老人保健なども被災したことから、改めて災害弱者への対応の困難さが顕在化しており、対策を講ずるべきである。"],["p","大規模災害時の現場では、保健医療福祉に関わる多職種の協働が欠かせない。日本歯科医師会では、2018（平成30）年度より厚生労働省の「災害歯科保健医療チーム養成支援事業」を受託し、災害歯科保健医療体制研修会を開催するなどして、人材育成に努めている。本事業では、円滑な災害歯科保健医療の展開に向けて、関係機関および関係団体等の多職種と協働し、適確かつ迅速に対応できる歯科医療従事者や行政職員等を養成し、各都道府県（歯科医師会）に配置することを目的としており、今後もその充実を図っていく。"],["p","また日本歯科医師会は日本医師会など医療関係7団体で組織する被災者健康支援連絡協議会に加わり、2016（平成28）年の熊本地震の際には初めてJMAT（日本医師会災害医療チーム）への歯科医師および歯科衛生士の参画を実現した。被災地の歯科保健医療ニーズを早期に把握する上からも、JMATへの参画は極めて重要であり、この動きをさらに全国に広めたい。また、全国の病院歯科医師のDMAT（災害派遣医療チーム）へ関与の明確化、DHEAT（災害時健康危機管理支援チーム）との関係構築等も併せて推進していく。"],["p","さらに日本歯科医師会は、災害時の活動を迅速かつ安全に行えるよう、災害対策基本法上の「指定公共機関」への指定を目指し、災害時における都道府県歯科医師会および関係団体との連携を深め、歯科保健医療提供体制の基盤を強化していく。そのためには、中央防災会議への日本歯科医師会の参画を目指す。"],["p","一方で、情報共有手段の充実を図るために、日本歯科医師会テレビ会議システムの充実、都道府県歯科医師会等とのWEB会議の普及、安否確認システムの構築等に努めていく。さらに今後は、厚生労働省のEMIS（広域災害救急医療情報システム）等への歯科診療所情報の掲載ならびにJ‑SPEED（災害時診療概況報告システム）等による被災地における歯科保健医療情報の共有化を目指していく。"],["p","また日本歯科医師会は、災害歯科保健医療連絡協議会や、災害時対策・警察歯科総合検討会議および災害歯科保健医療体制研修会等を基盤として、関係団体等との連携の下に、大規模災害時における被災地への支援体制を強化するとともに、災害時においても、しっかりとした歯科保健医療が全国で提供できるような体制整備にあたっていく。"],["li","関係職種と協働し災害時歯科保健医療に貢献できる人材の育成"],["li","日本歯科医師会を災害対策基本法上の「指定公共機関」としての位置づけへの取り組みの推進"],["li","災害時における情報収集及び発信体制の強化"]]},{"title":"3）世界の歯科医療をけん引する国際貢献活動の展開","blocks":[["p","日本歯科医師会「定款」の第2章第4条の事業の目的に「第1項各号の事業は、日本全国において行うとともに必要に応じて海外でも行う。」とある。このように現在の国際社会に対して日本歯科医師会は、人類の歯科口腔保健の推進といった観点から国際貢献を行っている。国際貢献については、下記の5項目が挙げられる。その現状と課題については以下のとおりである。（1）FDI（世界歯科連盟）からの国際貢献国際貢献の一つとして、FDIに加盟し、その目的であるすべての人々に最適な口腔保健と健康全般の増進、歯学の研究などに努めている。また、1983（昭和58）年には、日本で第71回世界歯科大会を開催している。さらに、FDIの理事会、委員会に日本からも理事および委員が就任し、運営面でも貢献している。ただし、日本歯科医師会の会員を含め関係者に対して、こうした取り組みの周知が不十分で、近年では特に、FDIへ参加していることの具体的な国際貢献の内容が知られていないことを課題として取り組んでいる。（2）WHO（世界保健機構）と連携した国際貢献2015（平成27）年3月に、WHOとの共催で「超高齢社会に向けた口腔保健」をテーマにした世界会議を東京で開催し、世界の中でいち早く超高齢者社会を迎えた国として日本の取り組みを世界に発信した。最終日には「健康寿命延伸のための歯科医療・口腔保健に関する『東京宣言』」を採択。しかしながら、同会議は単独事業であったことに加えて、WHOと日本歯科医師会との関係性はまだ不十分で、継続して協調体制を取るに至っていない。（3）アジア太平洋地域への支援アジア太平洋地域への支援として、国際学術交流基金による留学生へ助成金を交付し、これまでに22カ国、192名（図表57）に助成を行っている。また、口腔保健、歯科医療、歯科医学に関する研修会、学術大会への講師派遣や、口腔保健活動のための人材派遣、口腔保健関係資料の送付を実施している。こうした支援は継続していく方向だが、今後、どの国が何を必要としているかの情報収集に加え、JICAなど日本の他の支援団体との連携に務める必要がある。（4）他国の歯科医師会との交流による情報交換。"],["fig","図表57国際学術交流基金 国別助成者数"],["p","FDI世界歯科大会では、ビジネス会議や総会の合間を縫って、米国、仏国、独国、豪州、ニュージーランドとの協議会、意見交換会を設け、歯科に関する情報交換を行っている。また、韓国とは情報交換を中心とした包括的協力の覚書を結び、両国の歯科医療の発展、充実を図るための交流を行っている。これらの交流は重要であるものの、FDI全体における数か国間協議と共に多国間との協議の在り方についての検討も進めたい。（5）歯科材料・機器、技術に関する国際標準化活動への参画ISO（国際標準化機構）への日本の加盟は1952（昭和27）年で、その後1963（昭和"],["p","38）年に設立された歯科材料・機器、技術の規格を決定する歯科専門委員会（ISO/TC106）に日本歯科医師会は1977（昭和52）年から公式参加し、議論に加わっている。ISOはFDI以上に目的や対応内容が関係者に理解されておらず、更なる「見える化」が必要である。また委員会内での発信の仕方に工夫を凝らし、イニシアティブを取るよう努める。"],["p","日本歯科医師会のこれまでの国際貢献が認められ、我が国は先進的な歯科医療を実践している主要国としての地位を確立している。日本が世界の歯科の先進国であり続けるには、これまでの国際貢献を持続し、さらに充実させなければならない。"],["p","具体的に取り組むべき事項として、まずは国際交流・国際渉外に精通する人材の育成が挙げられる。現在、各都道府県歯科医師会には国際渉外に関する部署を設けているところはなく、これではなかなか国際交流・国際渉外に関わる人材は育たない。したがって、各都道府県歯科医師会の適任者を日本歯科医師会の国際渉外委員会に配置し、中長期にわたり活躍してもらう必要がある。国際的に通用する人材を多く育成できれば、日本歯科医師会の国際貢献の活動が充実する。"],["p","さらに、歯科学生の時から国際的な視野を養う面では、日本歯科医師会が主催する「スチューデント・クリニシャン・リサーチ・プログラム」（SCPR）の事業をより拡充させるほか、アジア太平洋歯科学生会議への支援も継続して人材育成につなげる。"],["p","日本歯科医師会が国際交流・国際渉外を通じて、どのような国際貢献を行い、その結果、世界の歯科界でどんな立ち位置にあるのかを会員に対して積極的に情報発信する必要もあるだろう。会員の理解が進めば、日本歯科医師会への信頼や愛着が増すと考えられ、国際貢献を実践する人材にとっての励みにもなる。アジア太平洋地域での口腔保健活動と後進国への支援も引き続き行っていく。日本歯科医師会はもともとFDIのアジア太平洋地域機構（APDF/APRO）の一員として、アジア太平洋地区の各国と連携を取ってアジア地域の保健活動の支援を行ってきたが、同機構の運営が不透明であることから、2006（平成18）年に豪州、ニュージーランドとともに同機構を脱退したまま今に至る。ただし、この状態では、アジア太平洋地域での活動に支障が出るため、新しい協力組織を立ち上げることとし、2019（令和元）年には前述の2カ国とAPA（アジアパシフィックアライアランス）を組んで定款を承認した。今後はこの3カ国を中心にアジア太平洋地域の口腔保健の向上に寄与し、発展途上国への支援を行っていく。"],["p","ただしAPDF/APROの定款が改定され、組織運営上の問題点が解決した場合は、APDF/APROへの復帰を視野に入れ、協力体制を取ることは確認している。"],["p","また、WHO西太平洋地域事務局（WPRO）がアジア・太平洋地域の高齢化対策の一つとして口腔保健分野への取り組みを検討している。本会としてはこれまでの「8020運動」の実績を踏まえて、WPROを通じてこれらの地域、特に歯科医療の開発途上への人材派遣の支援を行う。"],["p","このほか、国が行っている「アジア健康構想」など、国家のアジアへの健康戦略も注視し、日本歯科医師会がどのような形で国際貢献できるか情報の収集に努める。"],["li","国際交流・国際渉外に貢献できる人材の育成"],["li","FDI（世界歯科連盟）における日本歯科医師会の役割の明確化と国際貢献への寄与"],["li","WHOとの関係強化とWHO西太平洋地域事務局（WPRO）への支援"],["li","日本歯科医師会の国際貢献に関する会員への情報発信力の強化"],["li","アジア太平洋地域での口腔保健活動と発展途上国への支援"]]}]}]}]}</script>
<script>
"use strict";

/* ===== データ ===== */
var BOOK = JSON.parse(document.getElementById("bookData").textContent);
var KEY  = "vision2040-yomiage-v1";

/* 全項目を一次元に並べる（読み上げ・移動の単位） */
var FLAT = [];
BOOK.chapters.forEach(function(ch, ci){
  ch.sections.forEach(function(sec, si){
    sec.items.forEach(function(item, ii){
      FLAT.push({
        key: ci + "-" + si + "-" + ii,
        ci: ci, si: si, ii: ii,
        chapNo: ch.no, chapTitle: ch.title,
        secTitle: sec.title,
        title: item.title || sec.title,
        untitled: !item.title,
        blocks: item.blocks
      });
    });
  });
});

/* ===== 設定（localStorage） ===== */
var DEF = { rate:1.0, voice:"", fs:16, theme:"auto", readFig:true, autoNext:true, wake:false, timer:0, mark:null };
var cfg = (function(){
  try {
    var s = JSON.parse(localStorage.getItem(KEY) || "{}");
    var o = {}; for (var k in DEF) o[k] = (k in s) ? s[k] : DEF[k];
    return o;
  } catch(e){ return JSON.parse(JSON.stringify(DEF)); }
})();
function save(){ try { localStorage.setItem(KEY, JSON.stringify(cfg)); } catch(e){} }

/* ===== 小物 ===== */
function $(id){ return document.getElementById(id); }
function esc(s){
  return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}
var toastTimer = null;
function toast(msg){
  var t = $("toast"); t.textContent = msg; t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){ t.classList.remove("show"); }, 2200);
}

/* 文への分割（長い文は読点で分ける） */
function splitSentences(text){
  /* 句点までを1文とし、90字を超える文は読点でさらに分ける */
  var rough = text.match(/[^。！？]*[。！？]+|[^。！？]+/g) || [text];
  var out = [];
  rough.forEach(function(s){
    if (!s.trim()) return;
    if (s.length <= 90){ out.push(s); return; }
    var buf = "";
    (s.match(/[^、，]*[、，]+|[^、，]+/g) || [s]).forEach(function(p){
      if ((buf + p).length > 90 && buf){ out.push(buf); buf = p; }
      else buf += p;
    });
    if (buf) out.push(buf);
  });
  return out.length ? out : [text];
}

/* ===== 画面状態 ===== */
var view  = "toc";      /* toc / read / search */
var cur   = -1;         /* FLAT の位置 */
var sents = [];
var sIdx  = 0;
var openSec = {};

/* ===== 目次 ===== */
function renderToc(){
  var h = "";
  BOOK.chapters.forEach(function(ch, ci){
    h += '<h2 class="chap">' + esc(ch.no) + "　" + esc(ch.title) + "</h2>";
    ch.sections.forEach(function(sec, si){
      var id = ci + "-" + si;
      var direct = (sec.items.length === 1 && !sec.items[0].title);
      h += '<div class="sec' + (openSec[id] ? " open" : "") + '" data-sec="' + id + '"' +
             (direct ? ' data-direct="' + ci + "-" + si + '-0"' : "") + ">" +
             '<div class="sec-head' + (direct ? " direct" : "") + '"><span class="tw">▶</span>' +
               '<span style="flex:1">' + esc(sec.title) + "</span>" +
               '<span class="cnt">' + sec.items.length + "項目</span></div>" +
             '<div class="sec-body">';
      sec.items.forEach(function(item, ii){
        var key = ci + "-" + si + "-" + ii;
        var isCur  = (cur >= 0 && FLAT[cur].key === key);
        var isMark = (cfg.mark && cfg.mark.key === key);
        h += '<div class="item-row' + (isCur ? " reading" : "") + '" data-item="' + key + '">' +
               (isMark ? '<span class="dot"></span>' : "") +
               '<span class="t">' + esc(item.title || "（本文）") + "</span>" +
               '<span class="n">' + item.blocks.length + "</span></div>";
      });
      h += "</div></div>";
    });
  });
  $("tocList").innerHTML = h;

  var r = "", f = null;
  if (cfg.mark){
    for (var i = 0; i < FLAT.length; i++) if (FLAT[i].key === cfg.mark.key) { f = FLAT[i]; break; }
  }
  if (f){
    r = '<div class="sec" style="border-color:var(--accent)"><div class="sec-head" id="btnResume">' +
        '<span class="dot"></span><span style="flex:1"><b>続きから読む</b><br>' +
        '<span style="font-size:11px;color:var(--sub);font-weight:400">' +
        esc(f.chapNo) + "　" + esc(f.title) + '</span></span><span class="cnt">▶</span></div></div>';
  }
  $("resume").innerHTML = r;
  var rb = $("btnResume");
  if (rb) rb.onclick = function(){ openItemByKey(cfg.mark.key, cfg.mark.s || 0); };

  $("tocAbout").innerHTML =
    "<b>" + esc(BOOK.meta.title) + "　" + esc(BOOK.meta.subtitle) + "</b><br>" +
    esc(BOOK.meta.publisher) + "<br><br>" + esc(BOOK.meta.note) +
    "<br><br>本文は端末内でのみ扱い、外部には送信しません" +
    "（読み上げの声に「オンライン音声」を選んだ場合を除く）。";
}

/* ===== 本文 ===== */
function buildSents(item){
  var arr = [];
  item.blocks.forEach(function(b, bi){
    var kind = b[0], text = b[1];
    var speak = !(kind === "fig" && !cfg.readFig);
    if (kind === "h4" || kind === "li"){
      arr.push({ text:text, bi:bi, kind:kind, speak:speak });
    } else {
      splitSentences(text).forEach(function(s){
        arr.push({ text:s, bi:bi, kind:kind, speak:speak });
      });
    }
  });
  return arr;
}

function renderRead(){
  var item = FLAT[cur];
  $("readTitle").textContent = item.untitled ? item.secTitle : item.title;
  $("readSub").textContent   = item.chapNo + "　" + item.chapTitle +
      (item.untitled ? "" : "／" + item.secTitle);
  $("crumb").textContent = item.chapNo + " ＞ " + item.secTitle;
  $("crumb").classList.remove("hide");

  sents = buildSents(item);
  var html = "", open = -1;
  sents.forEach(function(s, i){
    if (s.bi !== open){
      if (open !== -1) html += "</div>";
      html += '<div class="blk ' + s.kind + '">';
      open = s.bi;
    }
    html += '<span class="sent" data-s="' + i + '">' + esc(s.text) + "</span>";
  });
  if (open !== -1) html += "</div>";
  $("readBody").innerHTML = html;
  document.documentElement.style.setProperty("--fs", cfg.fs + "px");

  $("btnPrevItem").disabled = cur <= 0;
  $("btnNextItem").disabled = cur >= FLAT.length - 1;
  highlight();
}

function highlight(scroll){
  var nodes = $("readBody").querySelectorAll(".sent");
  for (var i = 0; i < nodes.length; i++) nodes[i].classList.remove("cur");
  var el = $("readBody").querySelector('.sent[data-s="' + sIdx + '"]');
  if (el){
    el.classList.add("cur");
    if (scroll){
      var r = el.getBoundingClientRect();
      if (r.top < 90 || r.bottom > window.innerHeight - 190){
        window.scrollBy({ top: r.top - window.innerHeight * 0.38, behavior:"smooth" });
      }
    }
  }
  var total = sents.length || 1;
  $("progBar").style.width =
    Math.round(((sIdx + (player.state === "playing" ? 1 : 0)) / total) * 100) + "%";
  var t = sents[sIdx] ? sents[sIdx].text : "";
  $("nowText").textContent = (cur >= 0 ? (sIdx + 1) + "/" + total + "　" : "") + t.slice(0, 46);
}

/* ===== 画面切替 ===== */
function show(v){
  view = v;
  $("viewToc").classList.toggle("hide", v !== "toc");
  $("viewRead").classList.toggle("hide", v !== "read");
  $("viewSearch").classList.toggle("hide", v !== "search");
  $("btnBack").style.visibility = (v === "toc") ? "hidden" : "visible";
  $("btnSearch").classList.toggle("on", v === "search");
  if (v === "toc"){ renderToc(); $("crumb").classList.add("hide"); }
  if (v === "search"){
    $("crumb").classList.add("hide");
    setTimeout(function(){ $("q").focus(); }, 60);
  }
}

function openItem(i, startSent){
  if (i < 0 || i >= FLAT.length) return;
  stop();
  cur = i; sIdx = startSent || 0; player.done = false;
  show("read");
  renderRead();
  window.scrollTo(0, 0);
  mark();
  syncPlayBtn();   /* 項目を開いた時点で再生できるようにする */
}
function openItemByKey(key, s){
  for (var i = 0; i < FLAT.length; i++) if (FLAT[i].key === key) { openItem(i, s); return; }
}
function mark(){
  if (cur < 0) return;
  cfg.mark = { key: FLAT[cur].key, s: sIdx }; save();
}

/* ===== 読み上げ ===== */
var player = { state:"idle", done:false, voices:[], timer:null, wake:null };

function ttsOK(){ return "speechSynthesis" in window && "SpeechSynthesisUtterance" in window; }

function refreshVoices(){
  if (!ttsOK()) return;
  var all = speechSynthesis.getVoices() || [];
  var ja  = all.filter(function(v){ return /^ja(-|_|$)/i.test(v.lang || ""); });
  if (!ja.length && !all.length) return;   /* 起動直後の空配列では設定を消さない */
  player.voices = ja.length ? ja : all;
  var sel = $("selVoice");
  sel.innerHTML = '<option value="">自動（端末内の声を優先）</option>' +
    player.voices.map(function(v){
      return '<option value="' + esc(v.name) + '">' + esc(v.name) +
             (v.localService ? "" : "（オンライン音声）") + "</option>";
    }).join("");
  sel.value = cfg.voice || "";
}
function pickVoice(){
  if (cfg.voice){
    var m = player.voices.filter(function(v){ return v.name === cfg.voice; })[0];
    if (m) return m;
  }
  return player.voices.filter(function(v){ return v.localService; })[0] || player.voices[0] || null;
}

function speakFrom(i){
  if (!ttsOK()){ toast("この端末は読み上げに対応していません"); return; }
  while (i < sents.length && !sents[i].speak) i++;
  if (i >= sents.length){ finishItem(); return; }
  sIdx = i;
  highlight(true);
  mark();

  var u = new SpeechSynthesisUtterance(sents[i].text);
  var v = pickVoice();
  if (v) u.voice = v;
  u.lang = (v && v.lang) || "ja-JP";
  u.rate = cfg.rate;
  u.onend = function(){
    if (player.state !== "playing") return;
    speakFrom(sIdx + 1);
  };
  u.onerror = function(ev){
    if (player.state !== "playing") return;
    if (ev && ev.error === "interrupted") return;
    player.state = "idle"; syncPlayBtn();
    toast("読み上げを中断しました");
  };
  try { speechSynthesis.cancel(); } catch(e){}
  speechSynthesis.speak(u);
}

function play(){
  if (cur < 0){ toast("先に項目を選んでください"); return; }
  if (player.done){ sIdx = 0; player.done = false; }   /* 読み終えた後は先頭から */
  player.state = "playing";
  syncPlayBtn(); requestWake();
  speakFrom(sIdx);
}
function stop(){
  player.state = "idle";
  try { speechSynthesis.cancel(); } catch(e){}
  syncPlayBtn(); releaseWake();
  if (cur >= 0) highlight();
}
function finishItem(){
  if (cfg.autoNext && cur < FLAT.length - 1){
    cur++; sIdx = 0;
    renderRead(); window.scrollTo(0, 0); mark();
    speakFrom(0);
    return;
  }
  player.state = "idle"; player.done = true; syncPlayBtn(); releaseWake();
  toast(cfg.autoNext
    ? "最後まで読み終えました"
    : "この項目を読み終えました");
}
function syncPlayBtn(){
  var on = (player.state === "playing");
  document.body.classList.toggle("playing", on);
  $("btnPlay").textContent = on ? "■" : "▶";
  $("btnPlay").disabled  = (cur < 0);
  $("btnPrevS").disabled = $("btnNextS").disabled = (cur < 0);
}
function jump(d){
  if (cur < 0) return;
  var i = sIdx + d;
  if (i < 0) i = 0;
  if (i >= sents.length) i = sents.length - 1;
  sIdx = i; player.done = false;
  if (player.state === "playing") speakFrom(i);
  else { highlight(true); mark(); }
}

/* 画面スリープ抑止 */
function requestWake(){
  if (!cfg.wake || !navigator.wakeLock || player.wake) return;
  navigator.wakeLock.request("screen").then(function(s){
    player.wake = s;
    s.addEventListener("release", function(){ player.wake = null; });
  }).catch(function(){});
}
function releaseWake(){
  if (player.wake){ try { player.wake.release(); } catch(e){} player.wake = null; }
}

/* ===== 検索 ===== */
function runSearch(){
  var q = $("q").value.trim();
  if (!q){ $("hits").innerHTML = ""; return; }
  var hits = [], lq = q.toLowerCase();
  FLAT.forEach(function(f, fi){
    f.blocks.forEach(function(b){
      var t = b[1], p = t.toLowerCase().indexOf(lq);
      if (p < 0) return;
      var from = Math.max(0, p - 26), to = Math.min(t.length, p + q.length + 40);
      hits.push({
        fi: fi,
        path: f.chapNo + " ＞ " + (f.untitled ? f.secTitle : f.title),
        body: (from ? "…" : "") + esc(t.slice(from, p)) + "<b>" +
              esc(t.slice(p, p + q.length)) + "</b>" +
              esc(t.slice(p + q.length, to)) + (to < t.length ? "…" : "")
      });
    });
  });
  if (!hits.length){
    $("hits").innerHTML = '<div style="text-align:center;color:var(--sub);font-size:13px;padding:30px 0">' +
      "「" + esc(q) + "」は見つかりませんでした</div>";
    return;
  }
  $("hits").innerHTML =
    '<div style="font-size:11px;color:var(--sub);margin-bottom:8px">' + hits.length + "件</div>" +
    hits.slice(0, 200).map(function(h){
      return '<div class="hit" data-fi="' + h.fi + '"><div class="hp">' + esc(h.path) +
             '</div><div class="hb">' + h.body + "</div></div>";
    }).join("");
}

/* ===== 設定UI ===== */
var RATES  = [0.7, 0.85, 1.0, 1.2, 1.4, 1.6];
var FSIZES = [14, 16, 18, 21];
var TIMERS = [0, 10, 20, 30, 60];

function seg(el, list, val, label, on){
  el.innerHTML = list.map(function(v){
    return '<button data-v="' + v + '"' + (v === val ? ' class="on"' : "") + ">" + label(v) + "</button>";
  }).join("");
  Array.prototype.forEach.call(el.querySelectorAll("button"), function(b){
    b.onclick = function(){
      var raw = b.getAttribute("data-v"), n = parseFloat(raw);
      on(isNaN(n) ? raw : n);
    };
  });
}
function renderSet(){
  seg($("segRate"), RATES, cfg.rate,
      function(v){ return v + "×"; },
      function(v){
        cfg.rate = v; save(); renderSet(); applyRate();
        if (player.state === "playing") speakFrom(sIdx);
      });
  seg($("segFs"), FSIZES, cfg.fs,
      function(v){ return v + "px"; },
      function(v){
        cfg.fs = v; save(); renderSet();
        document.documentElement.style.setProperty("--fs", v + "px");
      });
  seg($("segTheme"), ["auto","light","dark"], cfg.theme,
      function(v){ return v === "auto" ? "自動" : v === "light" ? "明るい" : "暗い"; },
      function(v){ cfg.theme = v; save(); renderSet(); applyTheme(); });
  seg($("segTimer"), TIMERS, cfg.timer || 0,
      function(v){ return v ? v + "分" : "なし"; },
      function(v){ setTimer(v); renderSet(); });
  $("rateVal").textContent  = cfg.rate + "×";
  $("timerVal").textContent = cfg.timer ? cfg.timer + "分" : "なし";
  $("tgFig").className  = "tg" + (cfg.readFig  ? " on" : "");
  $("tgAuto").className = "tg" + (cfg.autoNext ? " on" : "");
  $("tgWake").className = "tg" + (cfg.wake     ? " on" : "");
  $("setAbout").innerHTML =
    "<b>" + esc(BOOK.meta.title) + "</b>　" + esc(BOOK.meta.publisher) + "<br>" +
    "収録：全" + BOOK.chapters.length + "章／" + FLAT.length +
    "項目<br><br>" + esc(BOOK.meta.note);
}
function applyRate(){ $("btnRate").textContent = cfg.rate + "×"; }
function applyTheme(){
  if (cfg.theme === "auto") document.documentElement.removeAttribute("data-theme");
  else document.documentElement.setAttribute("data-theme", cfg.theme);
}
function setTimer(min){
  cfg.timer = min; save();
  if (player.timer){ clearTimeout(player.timer); player.timer = null; }
  if (min > 0){
    player.timer = setTimeout(function(){
      stop();
      toast("スリープタイマーで停止しました");
      cfg.timer = 0; save(); renderSet();
    }, min * 60000);
    toast(min + "分後に停止します");
  }
}
function openSheet(o){
  $("sheet").classList.toggle("open", o);
  $("sheetBg").classList.toggle("open", o);
  if (o) renderSet();
}

/* ===== イベント ===== */
$("tocList").addEventListener("click", function(e){
  var row = e.target.closest(".item-row");
  if (row){ openItemByKey(row.getAttribute("data-item"), 0); return; }
  var head = e.target.closest(".sec-head");
  if (head){
    var sec = head.parentElement;
    var direct = sec.getAttribute("data-direct");
    if (direct){ openItemByKey(direct, 0); return; }
    var id = sec.getAttribute("data-sec");
    openSec[id] = !openSec[id];
    sec.classList.toggle("open", openSec[id]);
  }
});
$("readBody").addEventListener("click", function(e){
  var s = e.target.closest(".sent");
  if (!s) return;
  sIdx = parseInt(s.getAttribute("data-s"), 10);
  player.done = false;
  if (player.state === "playing") speakFrom(sIdx);
  else { highlight(); mark(); play(); }
});
$("hits").addEventListener("click", function(e){
  var h = e.target.closest(".hit");
  if (h) openItem(parseInt(h.getAttribute("data-fi"), 10), 0);
});
$("btnBack").onclick     = function(){ stop(); show("toc"); };
$("btnSearch").onclick   = function(){ show(view === "search" ? "toc" : "search"); };
$("btnSet").onclick      = function(){ openSheet(true); };
$("btnCloseSet").onclick = function(){ openSheet(false); };
$("sheetBg").onclick     = function(){ openSheet(false); };
$("btnPlay").onclick     = function(){ (player.state === "playing") ? stop() : play(); };
$("btnPrevS").onclick    = function(){ jump(-1); };
$("btnNextS").onclick    = function(){ jump(1); };
$("btnRate").onclick     = function(){
  var i = RATES.indexOf(cfg.rate);
  cfg.rate = RATES[(i + 1) % RATES.length]; save(); applyRate();
  toast("速度 " + cfg.rate + "×");
  if (player.state === "playing") speakFrom(sIdx);
};
$("btnPrevItem").onclick = function(){ openItem(cur - 1, 0); };
$("btnNextItem").onclick = function(){ openItem(cur + 1, 0); };
$("tgFig").onclick  = function(){
  cfg.readFig = !cfg.readFig; save(); renderSet();
  if (cur >= 0){
    var keep = sIdx; renderRead();
    sIdx = Math.min(keep, sents.length - 1); highlight();
  }
};
$("tgAuto").onclick = function(){ cfg.autoNext = !cfg.autoNext; save(); renderSet(); };
$("tgWake").onclick = function(){
  cfg.wake = !cfg.wake; save(); renderSet();
  if (!cfg.wake) releaseWake();
  else if (!navigator.wakeLock) toast("この端末は画面ロック抑止に未対応です");
  else if (player.state === "playing") requestWake();
};
$("q").addEventListener("input", runSearch);
$("selVoice").addEventListener("change", function(){
  cfg.voice = $("selVoice").value; save();
  if (player.state === "playing") speakFrom(sIdx);
});
document.addEventListener("visibilitychange", function(){
  if (document.hidden && player.state === "playing" && !cfg.wake) stop();
});
window.addEventListener("beforeunload", function(){ try { speechSynthesis.cancel(); } catch(e){} });

/* ===== 起動 ===== */
applyTheme(); applyRate();
document.documentElement.style.setProperty("--fs", cfg.fs + "px");
cfg.timer = 0;
show("toc"); syncPlayBtn();
if (ttsOK()){
  refreshVoices();
  speechSynthesis.onvoiceschanged = refreshVoices;
  setTimeout(refreshVoices, 400);
} else {
  $("nowText").textContent =
    "この端末は音声読み上げに対応していません（本文の閲覧はできます）";
}

</script>
</body>
</html>
