<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="歯科ビジョン読み上げ">
<meta name="theme-color" content="#0f766e">
<title>歯科ビジョン読み上げ</title>
<style>
:root{
  --bg:#f6f7f5; --card:#fff; --fg:#1f2937; --sub:#6b7280; --line:#e5e7eb;
  --accent:#0f766e; --accent-w:#ccfbf1; --mark:#fef3c7; --mark-line:#f59e0b;
  --fig:#f8fafc; --figfg:#64748b; --shadow:0 1px 3px rgba(0,0,0,.06);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0f1418; --card:#182026; --fg:#e6e9ec; --sub:#94a3b8; --line:#2b3540;
    --accent:#2dd4bf; --accent-w:#134e4a; --mark:#3f3410; --mark-line:#d97706;
    --fig:#141b21; --figfg:#8fa0b0; --shadow:none;
  }
}
:root[data-theme="dark"]{
  --bg:#0f1418; --card:#182026; --fg:#e6e9ec; --sub:#94a3b8; --line:#2b3540;
  --accent:#2dd4bf; --accent-w:#134e4a; --mark:#3f3410; --mark-line:#d97706;
  --fig:#141b21; --figfg:#8fa0b0; --shadow:none;
}
*{margin:0;padding:0;box-sizing:border-box;}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif;
  background:var(--bg); color:var(--fg); -webkit-tap-highlight-color:transparent;
  line-height:1.5;
}
.wrap{max-width:720px;margin:0 auto;padding:0 16px 190px;}

/* ヘッダ */
header{
  position:sticky;top:0;z-index:30;background:var(--bg);
  padding:calc(env(safe-area-inset-top) + 10px) 0 8px;
  border-bottom:1px solid var(--line);
}
.hrow{display:flex;align-items:center;gap:8px;}
.htitle{font-size:16px;font-weight:700;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.htitle small{display:block;font-size:11px;font-weight:400;color:var(--sub);}
.ibtn{
  background:var(--card);border:1px solid var(--line);color:var(--fg);
  width:38px;height:38px;border-radius:11px;font-size:16px;cursor:pointer;flex:0 0 auto;
  display:flex;align-items:center;justify-content:center;
}
.ibtn:active{background:var(--accent-w);}
.ibtn.on{background:var(--accent);color:#fff;border-color:var(--accent);}
.crumb{font-size:11px;color:var(--sub);margin-top:6px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}

/* 目次 */
h2.chap{font-size:13px;color:var(--accent);font-weight:700;margin:20px 0 8px;letter-spacing:.04em;}
.sec{background:var(--card);border:1px solid var(--line);border-radius:14px;margin-bottom:10px;overflow:hidden;box-shadow:var(--shadow);}
.sec-head{
  display:flex;align-items:center;gap:10px;padding:13px 14px;cursor:pointer;
  font-size:14px;font-weight:600;
}
.sec-head .tw{color:var(--sub);font-size:11px;transition:transform .15s;flex:0 0 auto;}
.sec.open .sec-head .tw{transform:rotate(90deg);}
.sec-head .cnt{font-size:11px;color:var(--sub);font-weight:400;flex:0 0 auto;}
.sec-head.direct .tw{transform:none;opacity:.5;}
.sec-body{display:none;border-top:1px solid var(--line);}
.sec.open .sec-body{display:block;}
.item-row{
  display:flex;align-items:center;gap:10px;padding:11px 14px 11px 30px;cursor:pointer;
  font-size:13px;border-top:1px solid var(--line);
}
.item-row:first-child{border-top:none;}
.item-row:active{background:var(--accent-w);}
.item-row .t{flex:1;min-width:0;}
.item-row .n{font-size:10px;color:var(--sub);flex:0 0 auto;}
.item-row.reading{background:var(--accent-w);}
.dot{width:6px;height:6px;border-radius:50%;background:var(--accent);flex:0 0 auto;}

/* 本文 */
.reader{padding-top:12px;}
.rt{font-size:18px;font-weight:700;margin-bottom:4px;line-height:1.45;}
.rs{font-size:12px;color:var(--sub);margin-bottom:16px;}
.blk{margin-bottom:14px;font-size:var(--fs,16px);line-height:1.95;}
.blk.h4{font-weight:700;color:var(--accent);font-size:15px;margin:22px 0 10px;}
.blk.li{
  display:flex;gap:9px;background:var(--card);border:1px solid var(--line);
  border-radius:11px;padding:11px 13px;margin-bottom:8px;
}
.blk.li::before{content:"●";color:var(--accent);font-size:9px;line-height:2.1;flex:0 0 auto;}
.blk.fig{
  background:var(--fig);border-left:3px solid var(--line);color:var(--figfg);
  font-size:13px;line-height:1.8;padding:10px 12px;border-radius:0 8px 8px 0;
}
.blk.note{font-size:13px;color:var(--sub);border-top:1px dashed var(--line);padding-top:10px;}
.sent{cursor:pointer;border-radius:4px;padding:1px 0;}
.sent.cur{background:var(--mark);box-shadow:0 0 0 2px var(--mark);border-bottom:2px solid var(--mark-line);}
body:not(.playing) .sent.cur{background:transparent;box-shadow:none;}
.navrow{display:flex;gap:10px;margin:26px 0 10px;}
.navbtn{
  flex:1;background:var(--card);border:1px solid var(--line);color:var(--fg);
  padding:13px;border-radius:12px;font-size:13px;font-weight:600;cursor:pointer;
}
.navbtn:disabled{opacity:.35;}
.navbtn:active:not(:disabled){background:var(--accent-w);}

/* 検索 */
.sbox{display:flex;gap:8px;margin:12px 0;}
.sbox input{
  flex:1;padding:11px 13px;border:1px solid var(--line);border-radius:11px;
  background:var(--card);color:var(--fg);font-size:15px;font-family:inherit;outline:none;
}
.sbox input:focus{border-color:var(--accent);}
.hit{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:8px;cursor:pointer;}
.hit:active{background:var(--accent-w);}
.hit .hp{font-size:11px;color:var(--accent);font-weight:600;margin-bottom:4px;}
.hit .hb{font-size:13px;color:var(--sub);line-height:1.7;}
.hit .hb b{color:var(--fg);background:var(--mark);}

/* 再生バー */
.bar{
  position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--card);
  border-top:1px solid var(--line);padding:9px 12px calc(env(safe-area-inset-bottom) + 9px);
}
.bar-in{max-width:720px;margin:0 auto;}
.prog{height:3px;background:var(--line);border-radius:2px;overflow:hidden;margin-bottom:8px;}
.prog i{display:block;height:100%;background:var(--accent);width:0;transition:width .2s;}
.now{font-size:11px;color:var(--sub);margin-bottom:8px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.ctrl{display:flex;align-items:center;justify-content:center;gap:10px;}
.cb{
  background:var(--bg);border:1px solid var(--line);color:var(--fg);
  width:46px;height:46px;border-radius:14px;font-size:15px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
}
.cb:active{background:var(--accent-w);}
.cb:disabled{opacity:.3;}
.cb.play{width:58px;height:58px;background:var(--accent);color:#fff;border:none;font-size:21px;border-radius:18px;}
.cb.play:disabled{background:var(--line);color:var(--sub);}

/* 設定シート */
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:50;display:none;}
.sheet-bg.open{display:block;}
.sheet{
  position:fixed;left:0;right:0;bottom:0;z-index:51;background:var(--card);
  border-radius:20px 20px 0 0;padding:18px 16px calc(env(safe-area-inset-bottom) + 18px);
  max-height:82vh;overflow-y:auto;display:none;
}
.sheet.open{display:block;}
.sheet h3{font-size:15px;margin-bottom:14px;display:flex;align-items:center;justify-content:space-between;}
.srow{padding:11px 0;border-top:1px solid var(--line);}
.srow:first-of-type{border-top:none;}
.slab{font-size:13px;font-weight:600;margin-bottom:7px;display:flex;justify-content:space-between;align-items:center;}
.slab span{font-weight:400;color:var(--sub);font-size:12px;}
.seg{display:flex;gap:6px;flex-wrap:wrap;}
.seg button{
  flex:1;min-width:52px;padding:9px 4px;border:1px solid var(--line);background:var(--bg);
  color:var(--fg);border-radius:10px;font-size:12px;cursor:pointer;font-family:inherit;
}
.seg button.on{background:var(--accent);color:#fff;border-color:var(--accent);}
.sheet select{
  width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;
  background:var(--bg);color:var(--fg);font-size:14px;font-family:inherit;
}
.sw{display:flex;align-items:center;justify-content:space-between;gap:12px;}
.sw .d{font-size:11px;color:var(--sub);margin-top:3px;line-height:1.5;}
.tg{
  width:50px;height:29px;border-radius:15px;background:var(--line);border:none;
  position:relative;cursor:pointer;flex:0 0 auto;transition:background .15s;
}
.tg::after{content:"";position:absolute;top:3px;left:3px;width:23px;height:23px;border-radius:50%;background:#fff;transition:transform .15s;}
.tg.on{background:var(--accent);}
.tg.on::after{transform:translateX(21px);}
.about{font-size:11px;color:var(--sub);line-height:1.8;padding:14px 2px 0;border-top:1px solid var(--line);margin-top:6px;}

/* トースト */
.toast{
  position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 150px);transform:translateX(-50%);
  background:#1f2937;color:#fff;padding:11px 18px;border-radius:11px;font-size:13px;
  z-index:60;opacity:0;pointer-events:none;transition:opacity .25s;max-width:88vw;text-align:center;
}
.toast.show{opacity:.96;}
.hide{display:none !important;}
</style>
</head>
<body>
<header>
  <div class="wrap" style="padding-bottom:0">
    <div class="hrow">
      <button class="ibtn" id="btnBack" title="戻る">‹</button>
      <div class="htitle" id="hTitle">2040年を見据えた歯科ビジョン<small>令和における歯科医療の姿</small></div>
      <button class="ibtn" id="btnSearch" title="本文を検索">🔍</button>
      <button class="ibtn" id="btnSet" title="設定">⚙</button>
    </div>
    <div class="crumb hide" id="crumb"></div>
  </div>
</header>

<div class="wrap">
  <!-- 目次 -->
  <div id="viewToc">
    <div id="resume"></div>
    <div id="tocList"></div>
    <div class="about" id="tocAbout"></div>
  </div>

  <!-- 本文 -->
  <div id="viewRead" class="reader hide">
    <div class="rt" id="readTitle"></div>
    <div class="rs" id="readSub"></div>
    <div id="readBody"></div>
    <div class="navrow">
      <button class="navbtn" id="btnPrevItem">‹ 前の項目</button>
      <button class="navbtn" id="btnNextItem">次の項目 ›</button>
    </div>
  </div>

  <!-- 検索 -->
  <div id="viewSearch" class="hide">
    <div class="sbox">
      <input type="search" id="q" placeholder="本文を検索（例：オーラルフレイル）" autocomplete="off">
    </div>
    <div id="hits"></div>
  </div>
</div>

<!-- 再生バー -->
<div class="bar" id="bar">
  <div class="bar-in">
    <div class="prog"><i id="progBar"></i></div>
    <div class="now" id="nowText">項目を選ぶと読み上げできます</div>
    <div class="ctrl">
      <button class="cb" id="btnPrevS" title="前の文">⏮</button>
      <button class="cb play" id="btnPlay" title="再生／停止">▶</button>
      <button class="cb" id="btnNextS" title="次の文">⏭</button>
      <button class="cb" id="btnRate" title="読み上げ速度">1.0×</button>
    </div>
  </div>
</div>

<!-- 設定 -->
<div class="sheet-bg" id="sheetBg"></div>
<div class="sheet" id="sheet">
  <h3>設定<button class="ibtn" id="btnCloseSet">✕</button></h3>
  <div class="srow">
    <div class="slab">読み上げ速度<span id="rateVal">1.0×</span></div>
    <div class="seg" id="segRate"></div>
  </div>
  <div class="srow">
    <div class="slab">声</div>
    <select id="selVoice"></select>
    <div class="d" style="font-size:11px;color:var(--sub);margin-top:6px;line-height:1.6">
      端末内の声を優先して選びます。「（オンライン音声）」はブラウザが外部に文字を送って合成する場合があります。
    </div>
  </div>
  <div class="srow">
    <div class="slab">文字サイズ</div>
    <div class="seg" id="segFs"></div>
  </div>
  <div class="srow">
    <div class="slab">画面テーマ</div>
    <div class="seg" id="segTheme"></div>
  </div>
  <div class="srow">
    <div class="sw">
      <div><div class="slab" style="margin:0">図表キャプションも読む</div>
        <div class="d">図表の説明文を読み上げに含めます。</div></div>
      <button class="tg" id="tgFig"></button>
    </div>
  </div>
  <div class="srow">
    <div class="sw">
      <div><div class="slab" style="margin:0">項目をまたいで続けて読む</div>
        <div class="d">最後まで読んだら次の項目へ自動で進みます。</div></div>
      <button class="tg" id="tgAuto"></button>
    </div>
  </div>
  <div class="srow">
    <div class="sw">
      <div><div class="slab" style="margin:0">再生中は画面を消さない</div>
        <div class="d">対応端末のみ。電池の消費が増えます。</div></div>
      <button class="tg" id="tgWake"></button>
    </div>
  </div>
  <div class="srow">
    <div class="slab">スリープタイマー<span id="timerVal">なし</span></div>
    <div class="seg" id="segTimer"></div>
  </div>
  <div class="about" id="setAbout"></div>
</div>

<script type="application/json" id="bookData">{"meta":{"title":"2040年を見据えた歯科ビジョン","subtitle":"令和における歯科医療の姿","publisher":"公益社団法人 日本歯科医師会（2020年10月）","note":"本アプリは上記ビジョン（公表資料）の本文を読み上げ用に収録したものです。図表そのものは収録しておらず、図表番号とキャプションのみを読み上げます。正確な内容は原典PDFをご確認ください。"},"chapters":[{"no":"第1章","title":"はじめに","sections":[{"title":"1　今なぜ歯科ビジョンの構築が必要なのか","items":[{"title":"1）時代の変化と主要な課題","blocks":[["p","今、時代は大きな変化の中にある。"],["p","日本はかつて昭和30年代以降に「う蝕（むし歯）の洪水状態」と呼ばれた時代があったが、かかりつけ歯科医を中心とした歯科界の総力を挙げたう蝕予防の取り組みと、学校歯科健診制度の充実により、この25年間だけを見ても12歳児のう蝕の数は1993（平成5）年の4.09本から2019（令和元）年の0.70本にまで大きく減少した。（図表1）"],["p","さらに、80歳以上になっても20本以上の自分の歯を保ち、生涯を通じて食べる喜びをもつことを目指し、日本歯科医師会が全国の歯科医師会会員、行政や国民とともに30年にわたり8020（ハチマルニイマル）運動に取り組んできた結果、運動開始当時8020を達成していた国民は1割にも満たなかったものが、2016（平成28）年には二人にひとりは20本の歯を保つようになった。（図表2）"],["p","このように、歯科界全体の努力によって治療、予防の両面において、我が国の歯科医療は歯科口腔保健の向上に大きな成果を上げてきたと言える。"],["p","一方、医療技術の進歩や社会の高齢化に伴う疾病構造の変化、急激な少子高齢化による公的医療保険制度の財政の逼迫など、歯科医療をとりまく環境も大きく変わり、歯科医療に対する国民のニーズも著しく変化している。加えて、20年後に目をやれば、人口の極端な高齢化に加えて、人口減少が進み、特に働き手、支え手の減少も含めて、新たに大きな課題の存在を目の当たりにする。"],["p","こうした社会の変化、国民ニーズの変化を視野に入れると、歯科界にとっても多種多様な課題が存在する。この課題と対応について、「2040年を見据えた歯科ビジョン検討会」を中心に、真摯な議論を積み重ねた。そこには重要な課題として「高齢化への対応」「歯科医療の質の向上と機能の強化」「新たな技術への対応」などが浮かび上がり、これまでの議論を踏まえ、今後特に取り組む重点事項を共有し、日本歯科医師会を先頭に歯科界の総力を挙げて取り組んでいきたい。本ビジョンは、そのための指標となるものである。"],["fig","図表112歳児の永久歯の一人当たり平均う蝕歯数の年次推移（学校保健統計調査（文科省）より日本歯科総合研究機構作成）"],["fig","図表28020達成者割合の年次推移（歯科疾患実態調査（厚労省）より日本歯科総合研究機構作成）"]]},{"title":"2）これまでの対応","blocks":[["p","このような歯科をめぐる環境の変化に対して、近年、歯科界としても積極的に対応を図ってきた。このことをまず認識しなければならない。"],["p","過去15年以上にわたり、歯科界は一丸となって「超高齢社会の新しい歯科医療のあるべき姿」について議論を重ね、多くの調査結果等のデータの収集・分析を行い、それに基づき「口の健康が全身の健康に密接に関わること」や「歯科医療の充実と口腔健康管理の推進が医療の財政側面や健康寿命の延伸に大きく貢献すること」をエビデンスと共に発信してきた。歯科界からのそれらの発信により、歯科医療、口腔健康管理の重要性への国民的理解は深まり、歯科界の目指す新しい歯科医療の姿は国の方針として共有されつつある。特に、予算編成の重要方針として政府がとりまとめる、いわゆる「骨太の方針」に、歯科医療や口腔機能管理の重要性が明記され、記述が充実してきていること、厚生労働省に設置された歯科口腔保健推進室の機能が強化されるなど、着実な成果が現れてきている。"],["note","＊歯科職種の関与の強い「口腔機能管理」に対して、「口腔衛生管理」とともに他職種も関与する「口腔ケア」を包含した広い概念として「口腔健康管理」と定義した。（図表3）"],["fig","図表3口腔健康管理　出典：櫻井薫「口腔ケア」に関する検討会の進捗と今後の展開（日本歯科医師会雑誌69（4）286〜287、2016年）／住友雅人：日本歯科医学会が提案する新しい「口腔ケア」の概念（日本歯科評論877、10〜11、2015年）"]]},{"title":"3）今後の対応と決意","blocks":[["p","今後は、歯科界に寄せられている期待に応え、歯科が担うべき新たな責任を宣言し、地域の中で具体的アクションとして展開していくことが求められる。その視点に立って、今般、日本歯科医師会は、これまでの議論と対応を整理するとともにこれからの人口減少問題を含めた諸問題を確認し、2040年を見据えた新しい歯科のビジョンの策定を行った。"],["p","この「2040年を見据えた歯科ビジョン－令和における歯科医療の姿－」では、2040年の社会の姿を描くとともに、その社会で歯科が担う新しい役割と責任を明確にし、今後の歯科医療、口腔健康管理の充実に向けたアクションを、具体的に且つ一体的・総合的に展開することを目指した。"],["p","このビジョン策定においては、外部有識者に参画頂いた検討会を設置し、その議論の中で、歯科関係以外の有識者からは「超高齢社会で歯科医療に望むこと」等の意見を得ると共に、地域の中での医療連携のあり方等については、医療関係の多職種の意見等も伺い、多角的な視点で議論をしたところである。"],["p","この検討会議においては「長寿社会においては単に長く生きることを目指す」だけではなく、「食べる」「話す」「笑う」といった日常生活の基本的な機能を、人生の最後まで全うすることを目指すべきであり、笑顔のあふれる真の健康長寿社会の実現に向けて、歯科医療や口腔健康管理の充実が必要である、との結論を得ることができた。この高い理念と社会的使命を踏まえ、課題と対応を具体化したものがこのビジョンである。"],["p","日本歯科医師会はこの新しい歯科ビジョンを踏まえて、国民のための積極的な政策提言を行い、国民と共に地域におけるアクションを起こしていく。"]]}]},{"title":"2　特に重点的に取り組む課題","items":[{"title":"","blocks":[["p","今後取り組むべき課題と対応については、各章において詳しく述べるが、冒頭に全体を通じてどのような点を重点的に取り組むべき課題として考えるべきか、ここにまとめて示すこととしたい。これは今後の歯科界の活動の指針となるべき重要事項であるとともに、国民に理解を得て、国民とともに進むべき重要事項でもある。"]]},{"title":"1）歯科医療の充実と適切な財源の確保","blocks":[["p","我が国の医療費の規模を見ると、主要国はいずれも高齢化に伴い増大しているが、高齢化を踏まえれば欧米よりまだ相対的には低い水準にあると見ることができる。さらに、その中に占める歯科医療費の割合は顕著に低下してきている。このように見ると、国民のニーズに応える水準の歯科医療サービス提供が十分にできていない現状にあると言える。（図表4）（図表5）"],["p","一方、我が国の社会保障全体を見ると、高齢化やそれに対応した機能強化、医療の高度化等に伴いその総額が拡大してきたが、全体としては十分な財源確保ができず、いわば「給付先行型福祉国家」というべき状況が続いている。特に、医療については、税、保険料、患者自己負担という財源構成となっている中で、主要な財源の一つである消費税は昨年（2019年）10％に引き上げられたところであるが、今後ますますニーズの拡大が見込まれるところであり、この国民ニーズに対応するためにはあらゆる面で財源の確保が求められる。"],["p","現状でも十分な水準ではない我が国の歯科医療の規模を国民ニーズに応えられる水準にしていくため、更なる国民の理解を得ながら、歯科医療の充実と適切な財源確保に努めていくことが必要である。日本歯科医師会としても、更なる社会保障の充実強化に向けて積極的に議論に参画していきたい。"],["fig","図表4高齢化率と社会保障の給付規模の国際比較（厚生労働省「上手な医療のかかり方を広めるための懇談会（平成30年11月12日）」資料より引用）"],["fig","図表5国民医療費と歯科診療医療費（国民医療費（厚生労働省）より日本歯科総合研究機構作成）"]]},{"title":"2）患者に対する歯科医療サービスの充実と患者のQOLの向上への寄与","blocks":[["p","「う蝕の洪水」の時期において、その国民的課題に歯科医療は総力を挙げて立ち向かい、大きな成果を上げたことは先に述べたとおりである。しかし、その後のう蝕の減少期に、「患者へのきめ細かな診療のための治療時間や治療体制の確保」「患者一人一人の生活や人生に寄り添う歯科医療への転換」へ向けての必要な財源確保や質の高い歯科医療への評価を得られなかったことが、歯科医療費の水準が低い現状の底流にある。"],["p","また1984（昭和56）年から1998（平成10）年までの20年近くにおいて、薬価引き下げによる診療報酬改定財源が歯科に振り分けられず、特に1984（昭和56）年から平成6（1994）年の10年の平均改定率は、医科の3.4％に対し、歯科は1.6％と半分以下であり、歯科医療の技術や価値にふさわしい適切な評価が確保されなかったといえる。"],["p","このため、今後は、国民の理解と納得を得ながら、歯科医療サービスの充実と患者の生活と人生に寄り添い、人生の質（QOL）の向上に積極的に寄与していく歯科医療を目指していく。本ビジョン検討会がまとめたように、長寿社会においては「食べる」「話す」「笑う」という生活の基本的な機能を最後まで維持することが重要であり、我々はそのための責務を全うしていく。この観点に立ち、以下の各章に述べられているように、歯科医療の質の向上（診療時間や従事者数、感染防止対策の充実強化）、イノベーション（新技術の導入と保険診療への取り込み、歯科診療所の機能強化）、最後まで幸せに生ききるための食支援（口腔機能の維持向上、オーラルフレイル対策、訪問歯科診療の充実）などに総合的に取り組んでいきたい。"]]},{"title":"3）社会保障にかかる総費用の効率化","blocks":[["p","今後の20年を展望すると、高齢者の数の増加が穏やかになる一方で、若年層の数が減少し、社会保障にとってはその担い手、支え手が減少していくことが見込まれている。こうした中で、持続可能な社会保障を考えていくためには、医療の充実を進める一方で効率化も視野に入れることが必要になっている。歯科の分野においても、こうした観点からの貢献を目指していきたい。そのため、近年は歯科医療の効果についても調査、分析とエビデンスの蓄積に努めてきた。この結果、歯科医療、口腔健康管理の充実は、単なる歯科医療の質の向上に資するのみだけではなく、医療ニーズの総量を減らすという、国民にとっても国の財政にとっても大きな貢献に繋がることが明らかになってきている。"],["p","例えば、入院中の口腔機能管理の徹底により、いずれの診療科においても在院日数の削減効果が統計学的に有意に認められ、その効果は10％以上あることが明らかになっている（図表6）。口腔機能管理によるこのような効果が現れるメカニズムは、病原菌のコントロールにより粘膜免疫の負担が軽減され、その結果、創傷治癒の促進や、合併症の減少が図れる結果とされているが、将来に向けて更なる検証も進めたい。いずれにせよ、口腔に近い領域だけではなく、侵襲が大きな治療の際に、口腔機能の管理がいかに重要であるかを示したデータであり、歯科医療が全身状態に大きく影響することを立証している。また、在院日数だけでなく、抗菌剤の投与期間も縮減できるというデータもあり、病院における歯科医療、口腔機能管理の徹底は「医療ニーズの総量の縮減」を通じて、患者にとっても、医療保険財政にとっても大きなメリットをもたらすものである。"],["p","また、歯の数と医療費の関係も明らかになっている。図表7はNDB（レセプト情報・特定健診等情報データベース）を活用した230万件の医科、歯科のレセプト（診療報酬請求明細書）の統合分析の結果を示したもので、男女を問わず、あらゆる年齢層で、歯の数が20本以上のグループは19本以下のグループより、医科医療費が低いことを明らかにしている。30年前の1989（平成元）年から展開を始めた8020運動は図表2に示したとおり、国の健康日本21での目標値を上回るスピードで成果を挙げてきたが、我が国の医療保険財政にも貢献してきたことは明らかである。"],["p","このように口腔機能管理を含む歯科医療の充実は、患者、国民にとっての大きな利益に繋がるとともに、医療保険財政ひいては国の財政へも貢献する。したがって、今後とも、入院患者や在宅患者、施設入所者を含め、すべての国民が質の高い歯科医療サービスを円滑に受けられるよう、2040年に向けての国の医療政策の中で必要な支援を推し進めることが重要である。"],["fig","図表6口腔機能の管理による在院日数に対する削減効果（千葉大学医学部附属病院における介入試験結果より。厚生労働省「中央社会保険医療協議会第259回総会（平成25年11月22日）」丹沢専門委員提出資料、厚生労働省「第84回社会保障審議会医療保険部会（平成26年11月27日）」堀委員提出資料より引用）"],["fig","図表7NDBからみた歯数と医科医療費との関連（NDB第三者提供データより日本歯科総合研究機構作成）"]]},{"title":"4）新型コロナウイルス感染症を踏まえた歯科医療","blocks":[["p","2020（令和2）年1月に国内最初の新型コロナウイルス感染症が確認されてから今日まで、この問題は一感染症にとどまらず、世界全体の未来に向けて、多くの問題を提起し、また様々な変化を求め続けている。特にこの問題には「疾病による生命の危機」と「国家の経済の危機」という、対応において相互に影響する側面が存在し、これまでの価値観や倫理観までも問い直す問題となっている。"],["p","我が国が近年、財政立て直しの視点、経済的視点で進めてきた医療政策に対しても「有事にあって国民の健康と生命をいかに守るのか」という社会保障の原点とも言うべき命題を明確に提起した。"],["p","そのような中、現時点ではこの新たな「ウイルス感染症」への対応は長期にわたるとの認識のもとで、国は感染拡大が常に起こりうる状況を想定した「新しい日常」を示そうとしている。「2040年を見据えた歯科医療」も、この「新しい日常」にふさわしい姿としたい。"],["p","当面の最も重要な視点は感染防止対策であり、「臨床現場における感染防止」については、少なくとも現時点まで、歯科治療を通じての感染拡大の事例やクラスター発生の事例報告がないことが注目される。改めて、日頃から歯科医療現場における感染防止対策や、今回標準予防策に加えて講じた対応も含めて、効果やコストも検証し、今後の流行に備えて更に強化する必要がある。診療現場が密にならないために講じた、診療時間、診療回数、予約調整等も含めた診療体制のあり方も議論が必要と考える。"],["p","「日常生活における感染防止」については、ウイルス感染に口腔健康管理が有効であることのエビデンスを更に整理し、発信していく。そして日常生活の中での口腔健康管理を、かかりつけ歯科医機能のひとつとして位置づけることも重要となる。"],["p","その他、今回の感染防護用品の供給が破綻に近い状況だったことを改善し、生産、流通、備蓄の体制を確保、強化することが強く求められる。今後同様の感染拡大があった場合に、対面診療ではなく、在宅でどのような指導管理等を行うべきか、またウイルス感染者への緊急歯科医療を行う際の提供体制の整備と明確化や、そのための人材育成も重要である。"],["p","以上について、診療報酬上の評価を含む議論を深め、これまでも目指してきた「生涯にわたり国民の生活に寄り添う歯科医療」として実現していく。"]]}]}]},{"no":"第2章","title":"データで見る2040年の社会と今後の歯科医療","sections":[{"title":"はじめに（章の導入）","items":[{"title":"","blocks":[["p","日本では、2025年にはいわゆる団塊の世代がすべて75歳以上の後期高齢者となり、その後2040年にかけては「高齢者の急増」から「現役世代の急減」に局面が変化していくと推計されており、若人1.5人が1人の高齢者を支える時代を迎えることとなる。"],["p","2040年を見据えた議論をする場合には、2次医療圏や市町村を単位とした場合の、人口当たりの歯科診療所数や歯科訪問診療実施数および歯科標ぼう病院の機能なども考慮する必要がある。当然ながら、すでに高齢化が進んでいる地域と2040年までに急速に高齢化が進む地域があり、その地域に存在する歯科医療提供体制などさまざまな因子を考慮する必要がある。"],["p","また、高齢化は地域住民の人口構成のみの問題ではなく、地域における歯科医療の確保の観点からは、歯科医療機関の継承問題等も非常に重要な課題である。以下に現時点で歯科医療における可能な推計や類型を行ってみた。"]]}]},{"title":"1　歯科診療所を受診する患者数の将来予測","items":[{"title":"","blocks":[["p","国立社会保障・人口問題研究所「日本の将来推計人口（平成29年推計）」によると、2045年時点で16.3％、2065年時点で30.7％の人口減少が予想されている（図表8）。また、平成26年時点の歯科診療所受療率のまま推移すると仮定すると、歯科診療所患者数推計では、2045年で10.8％の減少、2065年時点で25.2％の減少と推測される（図表9）。つまり、今後の人口減少に伴い歯科診療所患者数も総数としては大きな減少が見込まれている。ただし、その内訳を見ると、2045年頃までは65歳以上の患者数については増加していくと予測される。"],["p","歯科医療は歯科医療費の95％強を歯科診療所で提供している。外来における歯科医療が主体となっており、受療率（2011（平成23）年から作成）（図表10）をみると、70〜74歳をピークに減少している。一方で医科の外来も80〜84歳をピークに同様のカーブを描くが、医科ではその受け皿として入院や施設等への入所が考えられる。全国の病院において歯科標ぼうのある病院は約2割という現状のなか、歯科診療所へ通院ができなくなる時点で、高齢者の受療機会は失われている可能性が高い。直近の歯科診療所の歯科訪問診療を含む受療率（図表11）をNDBでも検証すると、2011（平成23）年より受療率のピークは75〜79歳へと高年齢化しているものの、80歳以降低下する傾向は同様である。"],["fig","図表8今後50年後までの人口推計（国立社会保障・人口問題研究所「日本の将来推計人口（平成29年推計）」より日本歯科総合研究機構作成）"],["fig","図表9今後50年後までの歯科診療所患者数推計（国立社会保障・人口問題研究所「日本の将来推計人口（平成29年推計）」および厚生労働省「患者調査」より日本歯科総合研究機構作成）"],["fig","図表10年齢階級別受療率（人口10万対）（患者調査（厚労省）より日本歯科総合研究機構作成）"],["fig","図表11年齢階級別1人当たり歯科受診回数（NDBオープンデータ（厚生労働省）より日本歯科総合研究機構作成）"]]}]},{"title":"2　歯科診療所への通院が困難な患者への歯科医療提供の現状とその課題","items":[{"title":"","blocks":[["p","介護が必要となった高齢者の調査（図表12）では、歯科医療や口腔健康管理が必要である高齢者は64.3％存在するが、実際に歯科医療につながっている割合は2.4％にとどまっているという調査結果もあり、需要・提供体制に乖離があることが課題となっている。"],["p","歯科診療所患者数推計（図表9）は、現状の需要（ニーズ）とサービス提供の乖離がある現状が変化しないと仮定した場合の推計である。早急に歯科界として国民の期待に応えられるように対策に取り組む必要がある。今後の大きな課題としては、地域の実情に合わせ、通院困難な患者への歯科医療提供体制をどのように構築していくかは大きな課題である。歯科訪問診療（居宅・施設別）実施割合や実施歯科診療所における実施件数は増加傾向（図表13）にあるが、歯科訪問診療を実施する歯科診療所割合は約2割にとどまっている。NDBによる都道府県別の歯科訪問診療提供には都道府県差も確認されている（図表14）。"],["p","また、2017（平成29）年医療施設調査および国立社会保障・人口問題研究所「日本の将来推計人口（平成29年推計）」をもとに、2010年から2035年にかけての75歳以上人口の増加率と医科・歯科の在宅医療・介護サービス件数の類型化を試みた（図表15、16）。2035年にかけて75歳以上人口が30％以上増加する2次医療圏は196にも及ぶ。2017（平成29）年データにおいても歯科と医科の在宅医療・介護サービスの提供状況ともに少ない2次医療圏は113となっており、それぞれの地域においてさまざまな問題が存在する可能性も示唆される。"],["fig","図表12要介護者の口腔状態と歯科治療の必要性（令和元年度日本歯科医学会プロジェクト研究「フレイルおよび認知症と口腔健康の関係に焦点化した人生100年時代を見据えた歯科治療指針作成に関する研究」中間報告書より引用）"],["fig","図表13居宅・施設別の実施歯科診療所割合と実施歯科診療所あたりの実施件数経年推移（日本歯科総合研究機構作成）"],["fig","図表14都道府県別の歯科訪問診療実施医療機関数（厚生労働省「中央社会保険医療協議会総会（第369回）」資料より引用）"],["fig","図表1575歳以上人口増加率（2010〜2035年）と75歳以上人口千人対在宅医療・介護サービス件数（医科・歯科）類型。75歳以上人口増加率が30％未満の2次医療圏は146、30〜60％は95、60％以上は101、合計342。医科・歯科の高い低いは75歳以上人口千人対在宅医療・介護サービス件数が中央値より高いか低いかを示す。"],["fig","図表16在宅医療・在宅歯科医療の提供状況（厚生労働省「医療施設調査」より日本歯科総合研究機構作成）"]]}]},{"title":"3　歯科診療所の継承等の課題と将来予測","items":[{"title":"","blocks":[["p","日本歯科総合研究機構では、「地域包括ケアシステムにおけるかかりつけの歯科医師が果たす役割と今後の働き方」（2020（令和2）年3月報告）などに関する調査を実施しており、日本歯科医師会会員である歯科医療機関の管理者約1万名に対し郵送調査を実施した結果、管理者の年齢は60歳代が最も多く、将来の医院継承について予定なしや不明は約9割を占めていた（図表17）。"],["p","また、現在の歯科診療所は徒歩圏内（概ね800m周囲）に存在する歯科診療所は1〜4軒（46.5％）が最も多く10軒以上も18.3％存在した。そして現在の周辺の歯科診療所について多いと感じているのは64.4％であり、少ないと感じているのは4.4％であった。2040年の周辺の歯科診療所はどのようになっているかを尋ねたところ、現在と同程度が43.7％で最も多く、次いで現在よりも少ないと回答したのが30.8％であった。つまり、20年後には今よりも周辺歯科診療所数は少なくなるとの回答は7倍に増加し、ほとんどなくなるとの回答も約3％存在する（図表18）。"],["p","何れにせよ、歯科診療所の継承が円滑に進まない実態があり、地域差はあるものの、持続的な歯科医療提供の確保が困難になりかねない。"],["p","歯科医師会員の回答で今後取り入れたいまたは拡大したい治療については、口腔機能低下症への対応が最も多く34.4％であった（図表19）。"],["fig","図表17回答管理者の年代および将来の継承の予定（地域包括ケアシステムにおける「かかりつけ歯科医師が果たす役割と今後の働き方等」（2020年3月）に関する調査・日本歯科総合研究機構）"],["fig","図表18周辺の歯科診療所数について2019年と2014年の予測（同調査より）"],["fig","図表19今後取り入れたいまたは拡大したい治療等について（同調査より）"]]}]},{"title":"4　2次医療圏ごとの歯科職種の状況と将来の課題","items":[{"title":"","blocks":[["p","2017（平成29）年医療施設調査および国立社会保障・人口問題研究所「日本の将来推計人口（平成29年推計）」をもとに、2010年から2035年にかけての75歳以上人口の増加率と現状における人口10万対歯科診療所に従事する歯科医師・歯科衛生士数の類型を行った（図表20）。"],["p","今後2035年にかけて75歳以上人口が60％以上増加する2次医療圏は101あり、そのなかでも、現時点で歯科医師・歯科衛生士ともに少ない2次医療圏は20存在し、歯科衛生士が少ないのは35存在している（図表21）。今後、75歳以上人口が急激に増加するとされている都市部においても、歯科医師および歯科衛生士不足に対する対応も非常に重要な課題である。"],["fig","図表2075歳以上人口増加率（2010〜2035年）と人口10万対歯科医師・歯科衛生士数類型。人口10万対歯科医師・歯科衛生士数は中央値より多いか少ないかの分類。"],["fig","図表212010〜2035年の75歳以上人口増加率が60％以上と高い地域における、歯科診療所に従事する人口10万対歯科医師・歯科衛生士数が中央値より少ない地域（厚生労働省「医療施設調査」より日本歯科総合研究機構作成）"]]}]},{"title":"5　歯科医師の需給問題","items":[{"title":"1）歯科医師数の将来推計","blocks":[["p","歯科医療の需要は、疾病構造や人口動態等に左右されるが、若年層に対しては歯科疾患の軽症化に伴う予防管理の充実や口腔機能の発育支援、高齢層に対しては通院困難な高齢者や在宅療養者などへの円滑な歯科医療提供が課題となっている。さらに多様化する歯科需要は、供給サイドの状況により変化する側面がある。例えば、訪問歯科診療の体制が充実している地域では、より正確な在宅歯科医療の需要の把握につながる。また専門性が高い歯科医療を提供できる医療機関が増加すれば、その需要がさらに顕在化することも考えられる。"],["p","このような観点から、歯科医師需給を検討するに当たっては、歯科医療提供の内容や質の問題を重視し、議論を深め、対策を講ずるべきである。実際、厚生労働省の『歯科医師の資質向上等に関する検討会』（2015（平成27）年1月〜）及び、その下の『歯科医師の需給問題に関するワーキンググループ』（2015（平成27）年2月〜2016（平成28）年4月）においても、歯科医療を取り巻く環境を踏まえた対応を主体に検討し、報告書が取りまとめられた。"],["p","また、歯科医師数については地域差が大きいことから、全国の総数で歯科医師需給を論じ、定量的に分析することには無理があることも事実である。現在では、各都道府県のホームページ上に、2次医療圏ごとの人口10万対歯科医師数が公開されており、どの地域が多く、また少ないかは明らかである。"],["p","かつては毎年3,000名以上の歯科医師が誕生していたものの、国家試験の合格率の低迷に伴い、その数は現状では2,000名程度にとどまっている。看護師の養成数は別格だが、医師が毎年8,000名〜9,000名、薬剤師は9,000名〜10,000名誕生しているのが現状である。"],["p","『通院困難な高齢者や在宅療養者などへの円滑な歯科医療提供』の需要が今後ますます増加するとしたら、将来の歯科界は過不足なく対応できるだろうか。提供する歯科医療の質が最優先であるが、一定の数は必要である。都市部は問題ないであろうが、過疎化が進み、住民がいないところで新規開業は見込めない。特に元々歯科医療機関が少ない地域における、歯科医師確保の問題は避けて通れない。"],["p","このように、2040年を視野に入れれば、歯科医療の将来像とこれによる歯科ニーズの変化を見込み、これに応じた歯科医師の適正な数をセットで議論することは必要不可欠と考えられる。そして、歯科医師の需給問題については、歯科医師の養成には長い時間がかかることから、現段階から議論を行っていくことが必須である。"],["p","図表22に歯科医師数の将来推計を示しているとおり、全国の人口10万対比歯科医師数は十数年先までほぼ横ばいだが、この間、就業歯科医師の高齢化が進み、70歳あるいは75歳でリタイアすることを想定すると、2025年辺りから就業歯科医師数は減少に転ずる可能性がある。また図表23にあるように、歯科診療所に勤務する歯科医師の割合は、過去50年かけて2倍以上に増加しており、この傾向は継続するものと考える。ただし、歯科診療所はほとんどが歯科医師1名〜2名の小規模診療所であり、現状のままでは歯科ニーズの多様化への対応、いわゆる多機能化が困難であるとすれば、機能強化・機能分化に基づく歯科診療所間の診診連携や、地域歯科医師会による複数歯科診療所のグループ化、あるいは地域全体での多機能化の検討や、病院歯科の機能強化、病診連携の推進などによる新たな方策を進めていくことが求められる。"],["fig","図表22人口10万対歯科医師数の推計及び2038年までの歯科医師数の将来予測。人口10万対歯科医師数は2008年75.7、2018年80.5、2028年82.3、2038年80.2。70歳でリタイアと仮定した場合は70.8、74.2、69.2、63.6。75歳でリタイアと仮定した場合は72.8、77.5、76.0、70.0。（厚生労働省「医師・歯科医師・薬剤師調査」より日本歯科総合研究機構作成）"]]},{"title":"2）需給バランスの課題","blocks":[["p","病院歯科医師は、医科歯科連携の要であり、さらに在宅歯科医療の後方支援や受療困難者の受け皿であるのに対して、歯科標榜がある病院は全体の2割程度に過ぎず、そのうち4割は常勤歯科医師1名の病院である。加えて図表24のとおり、全国の344医療圏のうち、約70医療圏では病院歯科がない。このほか、都道府県や市区町村の歯科保健行政を掌る行政歯科医師も不足している。この2分野については、特に需給バランスを欠いている状況であり、病院、施設、保健所、自治体等における、歯科医師の配置基準を新たに設ける等の対策が求められる。"],["p","また、提供体制不足と考えられる在宅歯科医療の分野であるが、日本歯科総合研究機構の分析によると、地域差があるものの、歯科訪問診療を実施している歯科医療機関の割合は、過去数年間でわずかな増加にとどまり、例えば、要介護者全員に1か月1回の訪問診療を想定した場合の充足率は10.6％であった（図表37）。"],["p","また、人口減少と超高齢社会の到来に伴い、東京一極集中のみならず、地方においても都市部への人口集中と過疎化の進行が顕著となっている。過疎地においては道路交通網等が整備されても、自力では医療機関へのアクセス困難な高齢者が増加している。さらに過疎地では、歯科医師の高齢化と後継者不在のために、歯科医療提供がますます困難となってきている。このため、歯科医療機関の運営支援と共に、介護分野との連携の下に、通院介助や訪問歯科診療の体制を強化する必要があり、さらにその後方支援にあたる病院歯科の充実と、スタッフが確保されたハブ的な歯科医療機関が過疎地の支援にあたるようなスキーム作りが求められる。"],["p","そもそも歯科の需給バランスを考える上で、国民の各世代でう蝕が減る一方で歯周病の罹患率が高まるという疾病構造の変化、あるいは超高齢化を背景とする在宅歯科医療や入院患者の口腔機能管理など、歯科需要の観点からの検討が必要である。これらを将来の患者数として正確に推測することは困難であるが、提供体制の基盤となる歯科医師の数や質の評価は、社会制度やシステムの影響を受けざるを得ない。したがって歯科医師需給について、需給バランスを定期的に検証するシステムの構築を目指す一方で、厚生労働省及び文部科学省、各大学等との連携を強化し、社会ニーズの変化に則した、シームレスな歯科医師養成の体制を整備する必要があり、その意味からも日本歯科医師会及び日本歯科医師会生涯研修制度が果たすべき役割は大きい。"],["p","将来の歯科医師数とも相関する歯科医師国家試験について付記する。各大学間に差異はあるものの、6年間で卒業する率の低下や、国家試験出願者数と受験者数の大きな相違は、深刻な状況にあり、かつて70％以上あった合格率は、第107回（2014（平成26）年）以降は63〜66％と低迷している。まずは、歯科医師国家試験として妥当な範囲と適切なレベルを保ち、歯科医師の資質向上を図ることが前提である一方で、歯学教育を巡っては座学偏重や国家試験対策偏重との指摘が散見されている。その是正と、歯科医師を目指す学生にとって極めて重要な診療参加型臨床実習の充実を図るためには、現状の共用試験を公的な位置づけとし、学生が行う歯科医行為をStudent Dentist（68ページ参照）として法的に担保すべきである（図表25）。"],["fig","図表23主たる業務の歯科医師数割合の年次推移（厚生労働省「医師・歯科医師・薬剤師調査」より日本歯科総合研究機構作成）"],["fig","図表242次医療圏の歯科または歯科口腔外科を標榜する病院数（厚生労働省「医療施設調査」より日本歯科総合研究機構作成）"],["fig","図表25歯科医師養成に向けた改革のイメージ"]]}]}]},{"no":"第3章","title":"目指す5つの柱","sections":[{"title":"5つの柱の位置づけ","items":[{"title":"","blocks":[["p","2040年の社会を踏まえ、本ビジョンでは、今後目指すべき取組として、次の5つを大きな柱に位置付けた。"],["li","健康寿命の延伸に向けた疾病予防・重症化予防に貢献する"],["li","地域を支える歯科医療を推進する"],["li","質が高く効率的な歯科医療提供体制を確保する"],["li","個人の予防・健康づくりをサポートする"],["li","多様なニーズに応え社会貢献を果たす"],["p","ここではその概要を示すこととし、「第4章」において柱実現のための具体的戦略を詳述する。"]]}]},{"title":"柱1　健康寿命の延伸に向けた疾病予防・重症化予防に貢献する","items":[{"title":"","blocks":[["p","人生100年時代を迎え、健康寿命の延伸は今や国策ともなっている。近年、歯の本数と全身の健康状態、歯周病と全身疾患との関係、口腔内細菌と心血管系疾患との関係等のエビデンスが次第に明らかになってきている。つまり、健康寿命を延ばすためには歯を含めた口腔内の健康維持が重要で、まずはその実践に向けてライフステージに応じた切れ目のない歯科健診受診機会の充実が欠かせない。"],["p","また現在、日本人の歯の喪失理由の第一位は歯周病であることを踏まえれば、その予防対策は急務である。高齢になっても健康でいるための基本は「自分の口で食べる」ことにある。法定化された歯周病検診（歯周疾患検診）が不十分な状態であることから、2025年度までに義務化や対象の拡大を目指す。もっとも、健診はあくまで歯周病などを早期発見するにとどまり、発症や再発、重症化の「予防」対策としては不十分といえる。そのため、定期的な歯科受診による歯周基本治療や定期的なメインテナンスなど、重症化予防効果が認められる医療行為についてはエビデンスの集積に努めるとともに、診療報酬上の評価につなげていく。"],["p","1989（平成元）年にスタートした「8020運動」はこれまで一定の成果を収めてきたところであり、日本歯科医師会では2015（平成27）年3月に、「オーラルフレイル」対策を加えた新たな国民運動として展開させていく方針を決めた。だが、オーラルフレイルに対する世間の認知度はまだまだ低いままにとどまる。市町村の介護予防・日常生活支援総合事業（総合事業）での「通いの場」などを活用して、オーラルフレイル対策の取り組みを進め、オーラルフレイル予防やオーラルフレイルの状態にある者に対してより健康な状態へ回復できることの実践を図る。オーラルフレイルは、身体の衰えであるフレイルと同様、適切な対応を取れば衰えを先送りできるとともに機能を戻すことができるとされ、そうした「可逆性」にあることを医療モデルで示す。併せてオーラルフレイルに対応した新たな保険病名の提案も目指す。他にもさまざまな取り組みを通じてオーラルフレイルに係る国民的認知度アップにつなげていく。"],["p","現在、予防を目的として提供される歯科医療については医療保険の適用外となっている項目も多い。保険適用が進めば予防歯科の普及に弾みがつくのは間違いないが、実現に向けての課題は大きい。それでも、どういう方策が取れるのか、取れないのかも含め、予防給付の拡大に向けた検討を進めたい。"]]}]},{"title":"柱2　地域を支える歯科医療を推進する","items":[{"title":"","blocks":[["p","少子・超高齢・多死社会を迎え、地域医療の拡充が喫緊の課題となる中、地域を支える歯科医療の担い手であるかかりつけ歯科医には、幅広い役割が期待されている。患者にとって症状が出た時にだけ手当てしてもらう、単なる行きつけの歯科医は「かかりつけ」とは言えず、周産期を含めたすべてのライフステージに応じて継続管理や重症化予防に努めるとともに、患者が健康に関することを日常的に相談できるのが、かかりつけの歯科医である。こうしたかかりつけ歯科医を養成するには、研修の充実が欠かせず、地域歯科医師会などが中心となって研修体制を整備する。"],["p","高齢者が住み慣れた地域で自分らしい生活を続けられることを目的とした地域包括ケアシステムの実現に向けては、在宅療養者を支えるべく、在宅歯科医療の推進も欠かせない。現在は、訪問歯科診療を行っているのは歯科診療所全体の約2割に過ぎないが、この数字を2040年までに倍増させる。そのためには、診療報酬の評価の拡充のほか、医療計画において在宅歯科評価項目の追加や目標値記載の必須化も目指す。"],["p","高齢者の増加とともに、「病院完結型」から「地域完結型」へと軸足がシフトし、今や地域において医療から介護までシームレスな提供が求められている。そのため、医科歯科連携はもとより、多施設・多職種との連携が欠かせない。口腔機能の管理は、生命予後に直結しかねない誤嚥性肺炎や低栄養を防ぐだけにとどまらず、長期入院患者や在宅療養患者、要介護者らの食に対する意欲を増進させる。しかしながら、現状では例えば医科から歯科につながらずに、歯科治療や口腔健康管理が十分に実施できていない在宅高齢者が散見される。歯科医師は医師以外にも医療・介護関係職種との協働が十分とはいえず、地域歯科医師会が主導するなどして地域でのネットワーク化を急ぐ。"],["p","現在、政府が提唱する「地域共生社会」は、高齢者や子ども、障がい者というような区分を超えて、地域全体で「丸ごと」対応しようというものである。その実現に向けて歯科では、施設・病院などから地域へ生活移行した障がい者や医療的ケア児などへの口腔健康管理の充実に向けて、地域福祉や病診連携などの地域連携を推進する必要がある。"],["p","子どもの支援をめぐっては、子ども本人のみならず、その親の子育ての支援にも積極的に関与することが欠かせない。様々な要因で女性が安心して生み育てられる社会とは言い難く、そうした状況で不安を抱える妊産婦に歯科の立場から寄り添い、妊産婦健診時などに産後うつや離乳食に頭を悩ませがちな母親に対してフォローアップする。また近年、社会問題化している児童虐待に関し、歯科医師は虐待を発見しやすい立場にあることを自覚し、早期発見に努める。"],["p","最後に、地域を支える歯科医療の推進に当たり、地域歯科医師会が果たす役割は大きいことから、その機能強化に努める。"]]}]},{"title":"柱3　質が高く効率的な歯科医療提供体制を確保する","items":[{"title":"","blocks":[["p","医療連携が進む中で、地域医療ネットワークやオンライン診療、またオンライン請求・資格確認等の普及が進み、歯科においてもICTの更なる活用が求められる。また歯科診療技術においては光学印象、CAD/CAM、AI診断、ロボット技術等が台頭しており、これらを使って、質を担保しながら一連の歯科治療の自動化や効率化を図っていく。"],["p","歯科医療提供においては歯科医師のみならず、歯科衛生士・歯科技工士等の果たす役割も重要である。健康寿命の延伸やQOLの維持向上に口腔健康管理の重要性が謳われる中で、それぞれがタスクをシェアしつつ相互に連携をとることが良質で効率的な医療提供につながる。だが、歯科衛生士、歯科技工士共に養成校への受験生確保が困難な状況が続いており、人材確保に向けて職業アピールや就業環境・労働条件の改善をはかると共に離職者に対する復職支援を推進する必要がある。"],["p","質が高く効率的な歯科医療提供体制の構築にあたっては、歯科界全体が活性化していることも欠かせない。活気あふれることで、新たな技術革新を呼び起こすことなどが可能となるからである。現状では国民の歯科ニーズの多様化に対応するための情報収集・分析力や技術開発力などに課題があるのも事実で、現在進める「オールデンタル」の取り組みを強化させる。このためには日本歯科医師会と産学官の連携が欠かせない。"],["p","また、今後、歯科治療の需要は従来の歯の形態回復などの治療中心型から、口腔機能の維持・回復を目指した管理・連携型へと変化していくものと推察される。こうした状況の変化に応じて、新規技術の導入・開発の促進につながるよう、日本歯科医師会は日本歯科医学会と協働して新たな保険病名を提案していく。"],["p","いわゆる働き方改革関連法の施行により、世の中全体で多様な働き方の実現が進み始めている。医師・歯科医師への適用は2024年まで猶予されているが、労働時間の改善は良質な医療の提供につながることから、前倒しで対策を進める必要がある。就業支援やICT活用による業務の効率化などを通じて、総合的な働き方改革を支援する。"],["p","国民へ良質な歯科医療を提供する大前提として、歯科医師の資質の維持・向上が欠かせない。歯科大学における基礎教育から臨床実習の充実を図ると共に、国家試験から臨床研修等の卒後研修を経て生涯研修へとシームレスな教育システムの構築が求められる。日本歯科医師会においては学会とも連携を図りながら質の高い「かかりつけ歯科医」を養成し、その立場を確立させることが必要である。"],["p","国民への歯科医療充実のために歯科界の抱える様々な課題を解決するには、政治や行政と連携を図ると共に社会へも効果的にアピールしていく必要がある。個々人の努力だけでは困難であり、組織としての力が必要となる。組織率の高さが強い立場を作っていくことから、かねてより課題となっている日本歯科医師会の会員組織率を様々な方策を通じて向上させる。"]]}]},{"title":"柱4　個人の予防・健康づくりをサポートする","items":[{"title":"","blocks":[["p","国民の健康寿命の延伸や生活の質の向上を目指し、生涯にわたる歯と口の健康づくりと予防を進めていく。そのためには、日常的なセルフケア、食習慣や栄養に関する正しい知識の普及と定着、健診とプロフェッショナルケアや必要な歯科治療が受けやすくなるような環境の整備、健康教育や広報活動の充実など、地域ごとに様々な施策を総合的に展開することが求められる。"],["p","さらに、わが国の医療保険制度の持続可能性との観点からも、地域や個人間の健康格差の是正が大きな課題となっている。特に、未受診者を対象とした重症化予防（早期診断・早期治療）のための対策が急務となっている。また中高年層を中心として、健康ニーズも多様化しており、その受け皿づくり、ヘルスケアの体制づくりについては、産学官民あげての取り組みが求められ、地域保健サービスの体系化を進める中で、歯科保健事業の充実を図っていく。そのうちの一つが食に関する支援である。小児や咀嚼機能が低下した高齢者に限らず、あらゆる世代を通じて、口から食べることの大切さや口腔機能の重要性を広く普及啓発する。"],["p","また一方で、少子高齢化の進展に伴い、ライフスタイルの多様化が進み、一人ひとりの個性や能力を活かし、安心して暮らせる共生社会の確立が大きな社会課題となっている。地域包括ケアにおける歯科医療機関および歯科職種の役割をより明確に位置づけ、様々な生活環境にある方々への口腔健康管理などが途切れることなく提供できるような体制を整備していく。その中で、変化する地域の実情に合わせ、かかりつけ歯科医が、重症化予防のための初期治療や、継続的な管理を今後も担っていく。"],["p","さらに健康教育においては、その端緒となるべく児童・生徒への歯科教育が極めて重要であり、『自らの健康を自ら守る』ヘルスプロモーションの信念を将来にわたり持ち続けるきっかけとなり得る。その充実に向けて、不断の見直しによるプログラム開発、ICT活用や、大学や専門学校への健康教育の対象拡大などを促進する。"],["p","次に、生活者の健康づくりにとって有益な歯科情報の提供であるが、得てして国民が興味を示す情報と、歯科医師が伝えたい情報には乖離がある。定期受診が習慣付いていて、自分の歯と口に関する十分な情報を得ている人はまだ限られることから、まずは生活者が知りたいコンテンツと媒体を拡充し、次に受療行動をも喚起するような広報展開を広範に実施する。"],["p","最後に、国民が自律的に健康づくりに取り組むためには、生涯にわたる健診記録などの健康情報を一元的に管理するシステム（PHR）の構築が極めて有用である。日本歯科医師会では「口腔診査情報標準コード仕様」を策定するなど、協力体制をとっていく。"]]}]},{"title":"柱5　多様なニーズに応え社会貢献を果たす","items":[{"title":"","blocks":[["p","世界最高峰の健康長寿社会を誇る我が国は、さらに一億総活躍社会の実現に向けて動き出している。また国民のライフスタイルの多様化や疾病構造の変化などに伴い、医療に対する社会ニーズも多様化し、これは歯科においても同様である。近年では、増え続ける在宅療養者に対する歯科保健や歯科医療の円滑な提供、地域医療ネットワークにおける多職種連携への参画、地域で取り組む健康教育への貢献、スポーツ現場の安全性の向上、災害地における被災者の健康支援、児童虐待の早期発見など、枚挙に暇がない。"],["p","さて現在では、老若男女を問わずあまねくスポーツを楽しんでいるが、競技者の歯や口の外傷予防を主体として、アスリートのパフォーマンス維持向上を目指し、スポーツ歯科医学の研究開発を促進することが欠かせない。また、国民のスポーツを通じた健康づくりを支援し、健康寿命やQOLの向上に貢献できるようなスポーツデンティストの養成体制を日本スポーツ協会と共同で強化する。さらに、国内外の競技会場に歯科医師が臨場できるよう、環境整備を図る。"],["p","また、近年頻発している自然災害発生時などの対策の中で、歯科が果たすべき役割は大きい。被災者の健康支援のために、緊急性が高い歯科医療の提供を始めとして、誤嚥性肺炎などに起因する災害関連死の防止を見据え、長期化する避難生活における口腔健康管理の継続的な実施などが主課題となる。これらに係る行政および関係団体との連携構築と、人材育成をさらに推進していく。"],["p","災害発生時の対策としては、他にも警察などからの要請に基づき実施する歯科所見による身元確認作業がある。国土強靭化や減災対策により差異はあるものの、南海トラフや首都直下地震の被災想定に対応できるレベルの準備体制は必ずしも整っていない。それゆえ全国の歯科医師会を中心としたネットワークの整備、ワークフローの統一および資器材の配備、教育や研修の充実、さらなる法整備などに向けて引き続き取り組んでいく。また、身元確認作業の高度化に向け、歯科診療情報の標準化が進展したことから、その普及を促進する。"],["p","日本は歯科の先進国でもあり、アジア健康構想など国の健康戦略も視野に入れ、今後も国際貢献活動を継続的に実施し、さらに拡充していく。具体的には、国際貢献に資する人材の育成、アジア太平洋地域などにおける歯科保健活動および発展途上国の支援、歯科器械や材料、技術などの国際標準化への参画などである。また、FDI（世界歯科連盟）の活動にも協力していく。"]]}]}]},{"no":"第4章","title":"柱実現に向けての具体的戦略","sections":[{"title":"柱1　健康寿命の延伸に向けた疾病予防・重症化予防に貢献する","items":[{"title":"1）ライフステージに応じた切れ目のない歯科健診の整備・拡充","blocks":[["h4","＜現状評価と課題＞"],["p","我が国の法的根拠に基づく歯科健診制度は、母子保健法による1歳6か月健診、3歳児健康診査、学校保健安全法による学校歯科健康診断、健康増進法に基づく40，50，60，70歳の歯周疾患検診が整備されている。また、後期高齢者医療広域連合による保健事業の一環として高齢者医療確保法に基づく後期高齢者歯科健診も整備されている。成人期の歯科健診については、酸蝕症等の労働安全衛生法が定める有害な業務等に対する特殊健康診査が実施されているが、その対象職種は限定されている。同法には一般従業員への歯科健康診査の実施は義務化されていない。したがって、産業保健の中で成人期の歯科健康診査はほとんど行われていないのが実情である。普及が進まない理由としては、経営者側が歯科健診の実施を単に「コスト」としてとらえ、従業員の健康維持や労働生産性の向上、医科医療費の削減につながるメリットを感じられずにいる点も大きい。"],["p","上記のように、法律で義務化されている歯科健診は、1歳6か月、3歳および学童期の学校歯科健診と事業所等での特殊歯科健診のみであり、高校卒業時の18歳から歯周疾患検診の始まる40歳までの働き盛りの世代には歯科健診の機会が無いに等しいことが大きな課題である（図表26）。また、2019年に成育基本法が施行されたが、妊産婦歯科健康診査も未だに法制化されておらず、自治体の努力義務に委ねられているため取り組みにばらつきが見られる。"],["p","一方で、歯の本数と全身の健康状態、歯周病と全身疾患との関係、口腔内細菌と心血管系疾患との関係等のエビデンスが明らかになり、2017（平成29）年より継続して骨太の方針に「生涯を通じた歯科健診の充実」との文言が盛り込まれたことは記憶に新しい。"],["p","こうした方針を受けて、厚生労働省は2018（平成30）年度から「歯科健康診査推進等事業」を通じて効果的な歯科健診の実施方法を検討している。現在、全国で様々な事業を展開中で、地域で行う集団歯科健診、診療所での個別歯科健診、職域での歯科健診等を行っている。この事業では、新しい歯科健康診査票、問診票に必要な項目や唾液検査の有用性等について検討しており、今後、新しい歯科健診票や問診票が統一され、生涯を通じた歯科健診の充実が図られる予定となっている。"],["h4","＜目指すべき方向性＞"],["p","人生100年時代を迎え、健康寿命の延伸は国策になっている。口の機能が衰えると身体機能も低下することから健康寿命を延ばすためには歯を含めた口腔内の健康維持が極めて重要で、その実践に向けてはライフステージに応じた切れ目のない歯科健診受診機会の充実が欠かせない。"],["p","高齢になっても健康でいるための基本は、「自分の口で食べる」ことにある。歯を失う一番の原因となる歯周病の自覚症状は40歳代で明らかになってくるが、それ以前より定期的な歯科健康診査や適切な歯科口腔保健指導を行うことで、高校生、大学生から発症する初期の歯肉炎をうまくコントロールしていくことで、将来的には歯周炎の発症を抑え、更に歯周病との関連性が指摘されている全身疾患の重症化予防へとつながると考えられる。"],["p","このような理由から、現在、18歳の高等学校までが対象となっている学校歯科健診制度を、大学、専門学校まで広げる必要があるだろう。加えて、高等学校卒業時から始まる歯科口腔保健指導の空白期間を埋めていくことも重要になる。"],["p","産業保健の分野では、日本歯科医師会として、経済産業省等の協力を得ながら、健康経営を積極的に実践している企業や事業所等での従業員歯科健診事例の収集に努める。その上で、それらの実践例を基に、歯科口腔保健の重要性を全国の経営者や事業主等に対して理解してもらうように働きかけていく。併せて、国に対しては、様々な形で労働者の歯科健康診査を就職時から毎年実施できるような体制づくりを要請する。"],["fig","図表26ライフステージにおける歯科健康診査"],["p","このほか、成人期の歯科健診の拡充に伴い、検査項目の中に、後期高齢者歯科健診も参考にした口腔機能評価の追加を求めていく。"],["p","最後に、歯科健診の整備・拡充にとって必要なことは、共通のプラットフォームを開発していくことである。ライフステージに合わせた新しい歯科健診システムの開発が急がれ、日本歯科医師会、学会、産業界が連携して取り組むべきだろう。利便性を踏まえれば、例えば多くの人が利用しているスマートフォンにこうした歯科健診システムを搭載し、手軽に歯科口腔保健のスクリーニングを受けられるようなアプリ開発が望まれる。"],["h4","◆実現のためのアクション◆"],["li","ライフステージに応じた切れ目ない歯科健診の法制化に向けた働きかけ"],["li","【最終的に2040年までに国民皆歯科健診の体制整備を目指す】"],["li","健康経営を実践している企業や事業所等における従業員歯科健診事例の収集と、経営層に対する歯科健診のメリットのアピール"],["li","成人期の歯科健診項目への口腔機能評価の追加要請"],["li","スマートフォンアプリ等を活用した歯科口腔保健スクリーニングシステムの開発"],["li","【2025年まで】"]]},{"title":"2）歯周病予防対策の強化","blocks":[["p","かつて我が国の歯の喪失原因の第一位はう蝕であったが、現在は歯周病である。また、厚生労働省の実施する歯科疾患実態調査をみると、2005（平成17）年から2016（平成28）年までの10年間で、中等度の歯周病の進行の目安になる4㎜以上の歯周ポケットを持つ者の割合が、20歳から40歳までの若年層において顕著に増加している（図表27）。"],["p","歯・口腔が健全に機能する前提である歯の喪失予防が必要であるにも関わらず、歯周病健診は健康増進法では義務化されていない上、現行では40歳以降の10歳刻みでの実施しかなく、歯周病対策は疾病予防、重症化予防の視点からは不十分と言える。加えて、上記の歯科疾患実態調査は5年（従来6年）ごとの実施で、対象者は国民健康栄養調査を母体とし、その参加者は年々減少していることから、歯周病をはじめとする歯科疾患を連続してモニターできる他の調査等の検討も必要だと思われる。"],["p","そもそも近年の研究の推進により、歯周病と全身疾患との関連性が続々と示されており、歯周病によって、心筋梗塞や脳卒中、糖尿病、認知症など、様々な疾患を引き起こしたり、その症状を悪化させることが知られる。それらの関連疾患の発生率が低下すれば、国民の健康維持増進に寄与すると共に医療費の削減効果にもつながることから、歯周病予防への注目度は高まっている。"],["p","こうした状況下、政府が2019（令和元）年6月に閣議決定した成長戦略実行計画には、「重症の歯周病を放置すると、糖尿病を発症する可能性があるとの指摘がある。歯科健診について受診率を高める必要がある。」との文言が盛り込まれた。さらに、成長戦略フォローアップには、「全身の健康にもつながる歯周病などの歯科疾患対策を強化するため、現在10歳刻みで行われている歯科健診の機会を拡大し、歯科の保健、指導を充実することについて、検証の結果を踏まえ、来年度までに検討に着手し、速やかに結論を得る。」との提言がなされた。さらに2020（令和2）年の同フォローアップには、「2021年度までに歯科健診（検診）の実施方法等の見直しの方向性について結論を得る。」と記載されている。"],["p","このように政府が方針を打ち出す中、日本歯科医師会として歯周病の予防に向けた取り組みを推進させるには、歯科だけからの発信のみならず、医科歯科連携のもとでのエビデンスの提示も重要と思われるが、医科との連携に際しては、ツールや連携方法に課題がある。例えば「糖尿病健康手帳における歯科の記載部分が十分活かされていない」、「IoTを活用した医科歯科連携が立ち遅れている」などの指摘があり、今後の具体的なツールの在り方についても検討する必要がある。"],["p","現在の歯周病の健診が不十分な状態であることから、2025年度までに健診の義務化や対象の拡大を目指す。ただし、健診はあくまで歯周病を早期発見するにとどまる一方、歯周病はプラークコントロールを主とする定期的な歯周基本治療とメインテナンスにより、発症や再発、重症化が予防できる。したがって、健診のみならず、こうした定期歯科受診に対する診療報酬制度を確保していくことも重要である。"],["fig","図表274㎜以上の歯周ポケットを持つ者の割合歯科疾患実態調査（厚労省）より日本歯科総合研究機構作成"],["p","2020（令和2）年度歯科診療報酬改定では、従来の歯周病安定期治療（SPT）の対象となっていない軽度の歯周病に対する歯周病重症化予防治療が新設された。このように診療報酬上の評価の充実を引き続き実現させていくことが欠かせない。また、歯周病の状態を把握できる検査や歯周病の実態をより的確に示す新しい病名（例えば口腔バイオフィルム感染症や生活習慣性歯周病など）の保険収載を目指すべきである。現在、バイオフィルム細菌叢を検出、分析する解析装置の研究開発が進んでいるが、短時間かつ低コストのチェアサイド細菌検査機器が完成して保険適用されることが大いに期待される。"],["p","日本歯科医学会及び傘下の各学会では2040年問題に対応するための歯科イノベーションの展開についての検討を進め、2020（令和2）年3月に「2040年への歯科イノベーションのロードマップ」を取りまとめた。その中で歯周病を巡っては、慢性歯周炎患者のデータベースの確立に基づく遺伝子学的な研究の促進、基礎研究をベースとした新たな臨床指標の開発、細胞移植治療の研究及び臨床応用̶̶などに取り組むことをうたっている。日本歯科医師会としては、これらの活動を支援し、併せて実現されたあかつきには、日本歯科医学会とともに国民に向けて、新しい治療法や予防について、広く啓発していく。"],["li","歯周疾患検診の義務化及び対象拡大【2025年までに対象拡大を目指す】"],["li","精緻な歯周病実態調査の実施【2030年までの調査開始を目指す】"],["li","医科と連携しての歯周病と医科疾患の関連調査の実施とエビデンスの構築"],["li","歯周病予防に関する診療報酬上の評価拡充ならび保険適用となる新病名や新技術収載に向けた働きかけの強化"]]},{"title":"3）オーラルフレイル対策の推進","blocks":[["p","1989（平成元）年にスタートした8020運動はこれまで一定の成果を治めてきた（4ページ参照）。一方、当初約80歳だった平均寿命は延伸し、いまや我が国は人生100年時代を迎えようとしていることから、超高齢社会への国民の健康観に対応し、2040年を見据えた歯科保健医療福祉のあるべき姿を見据えた取り組みが歯科界に求められていると言える。"],["p","日本歯科医師会では2015（平成27）年3月に、従来の8020運動に「オーラルフレイル」対策を加えて、新たな国民運動して展開させていく方針を決めている。フレイルは2014（平成26）年に日本老年医学会が虚弱を意味する英語の訳語として提唱した概念で、加齢とともに体力と気力が低下した状態を指す。そのままにしておくとやがて要介護になるリスクが高まるものの、適切な対応を取ればフレイルを先送りできるとされる。オーラルフレイルは身体的なフレイルの一部分を占めるものだが、フレイルの兆候は口腔から顕著に把握されることから、近年口腔に着目したオーラルフレイル対策の必要性が叫ばれるようになった。実際にいくつか興味深いデータも示されている。"],["p","東京大学が2012（平成24）年から千葉県柏市で約2,000名の65歳以上の高齢者を6年間追跡した調査では、オーラルフレイルが認められた人は、そうでない人に比べて身体的フレイル発症リスクが2.41倍、サルコぺニア発症リスクが2.13倍、要介護認定を受ける率が2.35倍、そして総死亡リスクも2.09倍高まるとの結果が得られた（図表28）。"],["p","その後、2018（平成30）年度歯科診療報酬改定では、口腔機能の維持増進という視点で、オーラルフレイルに対応した新病名として「口腔機能低下症」が採用され、検査料と管理料の算定が可能になった。口腔機能低下症はオーラルフレイルがさらに進行して 疾患 とみなされる状態に当たる（図表29）。また、この診療報酬改定と機を同じくして、厚生労働省はフレイル対策を本格化させ、自治体の取り組みに対する支援を開始した。これらの動きに合わせて、日本歯科医師会は8020運動30周年の節目として2018（平成30）年から2019（令和元）年にかけて、国民向け啓発リーフレット「オーラルフレイル」（図表30）と歯科診療所における「オーラルフレイル対応マニュアル」（図表31）作成した。さらに、市区町村等での取り組み例などの実例集（図表32）及び概要リーフレットを作成した。しかしながら、オーラルフレイルに対する社会の認知度はまだまだ低いままにとどまっている。"],["fig","図表28歯科口腔機能の衰えが重複した状態：オーラルフレイルのある高齢者"],["fig","出典：「Oral Frailty as a Risk Factor for Physical Frailty and Mortality in Community‑Dwelling Elderly, JGerontol A Biol Sci Med Sci（2017）」（東京大学高齢社会総合研究機構　飯島勝矢、田中友規）"],["fig","図表29口腔機能低下症（日本老年歯科医学会）厚生労働省「中央社会保険医療協議会（第376回）」資料より引用"],["fig","図表30国民向けリーフレット"],["fig","図表31歯科診療所におけるオーラルフレイル対応マニュアル2019年版"],["fig","図表32通いの場で活かすオーラルフレイル対応マニュアル〜高齢者の保健事業と介護予防の一体的実施に向けて〜2020年版"],["p","直近では、市区町村の介護予防・日常生活支援総合事業（総合事業）での「通いの場」などを活用して、オーラルフレイル対策の取り組みを促進して、その予防やオーラルフレイル者をより健康な状態への回復を図っているが、その際オーラルフレイルは、身体的フレイルと同様、しかるべき適切な介入により機能を戻せる可逆性があることを強調したい。"],["p","歯科医療従事者は口腔機能低下症における医療効果・実績も明らかにし、実際にオーラルフレイルが可逆性であることを医療モデルで示すべきである。加えて、オーラルフレイルを予防することで、他の医科疾患の重症化を予防できるかや、新たな診断名との関連を調査、検討する必要もある。"],["p","今後は国民向け啓発リーフレット等や「通いの場」や集団での歯科健診事業などを通じて、8020運動とともにオーラルフレイルという用語についての理解を広く国民に周知するべくオーラルフレイルに係る国民的認知度アップに向けた普及啓発活動にも力を注ぐ。"],["p","日本歯科医師会ではこれらの取り組みを通じて、国民運動としてのオーラルフレイル対策を展開していくことにより、「食べる」「話す」「笑う」といった日常生活の基本的な機能を、人生の最後まで全うできるように支援する。そして、笑顔のあふれる真の健康長寿社会の実現を目指す。"],["p","またオーラルフレイル対策と併せて、全国に普及した後期高齢者歯科健診における、口腔機能評価を充実することで、相乗的な効果を図る。"],["li","オーラルフレイルに係る国民的認知度アップに向けた取り組みの強化"],["li","【2025年までに認知度を50％に】"],["li","市区町村が実施している介護予防事業におけるオーラルフレイル対策の定着に向けた取り組みの強化"],["li","【全ての都道府県で、複数の市区町村がオーラルフレイル対策を介護予防事業等として取り組む】"],["li","オーラルフレイルの取り組みを条例に定める都道府県の増加に向けた対応の促進"],["li","オーラルフレイルに対応した新たな保険病名の提案"]]},{"title":"4）予防推進のための給付の拡大","blocks":[["p","現在、予防歯科、すなわち歯のトラブル予防を目的として提供される歯科医療の大半が公的医療保険の適用外となっている。保険適用が進めば予防歯科の普及に弾みがつくのは間違いないが、実現に向けての課題は大きい、そもそも、我が国の医療保険制度の大きな特徴は、勤労者の業務外の疾病や負傷などの稼得能力の喪失に対して保険給付を行うことを基本とし、保険で給付される保険事故を具体的に列挙する形をとったことにある。保険事故が起きた場合の保険給付ということになるため、すべての対象者に行われるサービスや、個人の責任によるもの、病気と言えないものは保険給付の対象には含まれない。予防や健康づくりを保険給付の対象にできないかという議論はかねてから行われてきたが、この保険制度の基本的な考え方から給付の対象外とされてきた。"],["p","一方、2000（平成12）年に施行された介護保険制度では当初から予防給付の概念が盛り込まれた。だが、対象者や給付にあくまで保険制度として成立するように枠組みを設定する必要があったため、対象者を要支援認定を受けたものに限定し、給付については給付限度額を設定し、サービスは介護支援専門員（ケアマネジャー）が計画を立てるという制度とした。その上で、保険給付として本人がサービスを選択し、それを保険制度が費用償還する仕組みとなった。"],["p","医療保険を巡ってはその後、医療の専門職が関わる予防の必要性が強く認識されるようになるものの、予防を正面から保険給付として位置づけることは困難であるため、個々の医療行為、診療報酬項目に即して議論が行われてきた。"],["p","診療報酬については、中央社会保険医療協議会で改定のたびに個々の点数の議論が行われるため、制度的な見直し論議の機会は少なかったが、医療保険改革の議論の中で、2012（平成"],["p","14）年に診療報酬の体系の見直しについて基本方針を政府として決定すること、という合意がなされ、改正法の附則に規定された1）。それに基づいて翌年に閣議決定されたのが「診療報酬体系の見直しに係る基本方針」2）である。"],["p","この閣議決定では、歯科診療報酬について、以下のように書かれている。「上記のほか3）、口腔機能の維持・増進の観点から、歯科診療所と病院歯科における機能や連携に応じた評価、う蝕や歯周疾患等の重症化予防、地域医療との連携を重視した在宅歯科医療等の評価を進める。」"],["p","ここに「重症化予防」と書かれているのは極めて重要であって、広い意味で予防に属する医療行為であっても、基礎疾患がある場合には、重症化予防として保険給付の対象とするということである。個々の技術について議論は行われてきたが、診療報酬体系の見直しにおいて重症化予防を閣議決定したことは、改定論議に道筋を付ける意義を有するとともに、高齢化におけ"],["p","1）健康保険法等の一部を改正する法律（平成14年法律第102号）附則第2条第2項。"],["p","2）健康保険法等の一部を改正する法律附則第2条第2項の規定に基づく基本方針（医療保険制度体系及び診療報酬体系に関する基本方針について）（平成15年3月28日閣議決定）"],["p","3）医療技術の適正な評価、医療機関のコスト等の適切な反映、患者の視点の重視の3点がこの前に書かれている。る医療の将来性を指し示したものとも言える。"],["p","介護保険のような保険給付が必要かどうかの認定の仕組みを持たない医療保険においては、医師・歯科医師の判断で給付の必要性が判断される。予防を給付の中に位置づけていく際には、したがって、疾患の存在と、定期的・継続的な介入が必要であること、それによって疾患の進行が抑えられて結果的に医療費等の社会的コストが軽減されること、といった内容がエビデンスをもって示されることが重症化予防という位置づけを得るために必要不可欠となる。"],["p","歯科の分野で言えば、疾患概念についてさらに精緻化・明確化・拡大を目指していくこと、歯科介入の成果等に関するデータに基づきエビデンスを構築していくこと、適切な介入ができる歯科医師を養成するとともに新たな質の高い歯科医療を提供できる体制を作っていくことが必要になる。"],["p","いずれにしても、高齢化によってニーズは増大しており、患者・国民が歯科医師と継続的関係を築き、生涯にわたって人生の充実のために支援を受けることは社会の要請であり、それに答えていくことが歯科界全体に求められる。"],["li","重症化予防に関わるエビデンスの構築"],["li","診療報酬体系における予防歯科の位置づけの検討"],["li","公的医療保険における予防給付の拡大に向けた取り組みの強化"],["p","【2030年までに歯周病以外の口腔機能に関わる分野で実現】"]]}]},{"title":"柱2　地域を支える歯科医療を推進する","items":[{"title":"1）かかりつけ歯科医の養成、かかりつけ歯科医機能の強化","blocks":[["p","少子・超高齢・多死社会を迎え、地域医療の拡充が喫緊の課題となる中、地域を支える歯科医療の担い手であるかかりつけ歯科医には、より幅広い役割が期待されている。日本歯科医師会では、「かかりつけ歯科医」について図表33のとおり「かかりつけ歯科医とは、医療・介護に係る幅広い見識を持ち、地域住民の生涯に亘る口腔機能の維持・向上を目指し、地域医療の一翼を担う者としてその責任を果たすことができる歯科医師」と定めている。また、かかりつけ歯科医が担う役割として、ライフステージに応じた継続管理や重症化予防、リスク管理等を挙げ、医療機関のみならず在宅での歯科医療を実施していくことを謳っている。これは、患者・住民の口腔健康管理を長期継続的に実施することが重要であり、そのことが国民の健康寿命の延伸やQOLの向上につながっていくからに他ならない（図表33）。"],["fig","図表33日本歯科医師会による定義と見解（日本歯科医師会HPより）■ かかりつけ歯科医とはかかりつけ歯科医とは、安全・安心な歯科医療の提供のみならず医療・介護に係る幅広い知識と見識を備え、地域住民の生涯に亘る口腔機能の維持・向上をめざし、地域医療の一翼を担う者としてその責任を果たすことができる歯科医師をいう。■ かかりつけ歯科医が担う具体的な役割（例）かかりつけ歯科医としての知識や技能を習得し、地区の歯科医師会の組織や機能を活用するなどし、変化する地域の実情や歯科医療機関が持つ機能に合わせて次のような役割を果し、地域住民の要請に応えてゆく。重症化予防のための必要な初期治療および継続的な疾病管理在宅、病院、介護施設等の患者が療養する場における継続的かつ適切な歯科医療の提供や口腔機能管理、チーム医療、退院時カンファレンスなどへの積極的な参画行政や後方支援機能を有する医療機関、近隣の医科医療機関などの関係機関と連携する中で他職種との連携を図る歯科診療を通じた認知症や児童虐待の早期発見と関連機関との連携歯科健診や住民を対象とした講演会などの公衆衛生活動への参画介護認定審査会や地域ケア会議への参画など介護保険施設等の協力医歯科療機関として関与　など"],["p","では、かかりつけ歯科医の実態はどうなっているのか。日本歯科医師会が2018（平成30）年4月に15〜79歳の男女1万人を対象にインターネットを活用して行った「歯科医療に関する一般生活者意識調査」によると、これまでに歯科治療を受けた経験のある者のうち、かかりつけ歯科医がいると回答した割合は全体の63.0％であった。年齢が上がるとともにその割合は増える傾向にあり、70代が最も高い81.7％。一方、20代では49.5％と半数以下だった。（図表34）。"],["p","現在の歯の治療状況では、現在治療中との回答が12.1％であり、現在は治療を受けていないが定期的にチェックを受けていると回答した「定期受診者」の割合は31.3％であった。10代や20代ではその割合は2割程度にとどまっていた（図表35）。"],["p","診療報酬体系においては、かかりつけ歯科医の機能を評価する観点から、2016（平成28）年度診療報酬改定で「かかりつけ歯科医機能強化型歯科診療所（か強診）」の制度が創設された。2018（平成30）年度の改定ではかかりつけ歯科医機能をより一層推進することを目的にその施設基準が一部見直されたところであり、う蝕や歯周病の重症化予防に関する継続的な管理実績等が要件に追加されたほか、かかりつけ歯科医として必要な知識や技術の習得を推進するため、研修内容の見直しなどが行われた。"],["p","2020（令和2）年3月時点で「か強診」の届出数は11,195施設で、歯科診療所全体の16.4％となっている。"],["p","日本歯科医師会が目指す「かかりつけ歯科医」は、患者にとって症状が出た時にだけ手当てしてもらう、単なる行きつけの歯科医ではなく、人生における様々な場面で、病気の治療や予防、健康に関することを日常的に相談できて、かつ継続的に適切な治療や管理を提供する歯科医である。必要に応じて、医科や介護へのスムーズな橋渡し役も担う。"],["p","そうしたかかりつけ歯科医を養成するには、研修の充実が欠かせず、地域歯科医師会などが研修体制の整備に加え、地域歯科医師会では地域連携ネットワークの構築・強化にも努める。"],["fig","図表35現在の歯の治療状況歯科医療に関する一般生活者意識調査（2018年）日本歯科医師会"],["fig","図表34かかりつけ歯科医の有無歯科医療に関する一般生活者意識調査（2018年）日本歯科医師会中心となって、研修体制を整備する。その際、座学のみならず、地域の病院歯科等を活用した実地研修も取り入れていくべきである。"],["p","個々の個人立歯科診療所や多機能型の歯科診療所、病院歯科との連携を確立するだけではなく、地域における医科歯科連携、介護、障害福祉関係機関との連携も図る。その結果、かかりつけ歯科医が様々な情報を得られやすくなる上、活躍の場も広がる。"],["p","かかりつけ歯科医が普及・拡大するには、長期の口腔健康管理を実施するのに適した診療報酬上の評価も望まれる。2020（令和2）年度の診療報酬改定では、歯科疾患管理料について6か月以上を超え継続的に管理している場合の評価が新設され、「長期管理加算」として、「か強診」は120点、それ以外は100点加算できるようになった。こうした診療報酬の評価の拡充に向けた働きかけに引き続き取り組んでいく。"],["p","かかりつけ歯科医は、乳幼児期から高齢期までのライフステージに応じた継続管理や重症化予防のための適切な歯科医療の提供および保健指導を担うが、患者は転校・転勤、就学・就労などのタイミングで地元から転居してしまうことは往々にしてある。その場合、転居先の歯科医療機関と連携して患者の治療・管理が継続されるようにするのはかかりつけ歯科医の務めである。"],["p","このほか継続した歯科医学管理の実践に当たっては、医療データの標準化と生涯にわたる保存、健康・医療情報を自ら管理するPHR（パーソナル・ヘルス・レコード）の活用が重要となることから、日本歯科医師会としてはそれらの推進に努めていく。"],["p","以上の取り組みを通じて、かかりつけ歯科医を持つ者および定期的に歯科受診する者の割合を上昇させる。"],["li","かかりつけ歯科医養成のための研修体制の整備"],["li","地域連携ネットワークの構築・強化"],["li","長期の口腔健康管理を実施するのに適した診療報酬上の評価の拡充に向けた働きかけ"],["li","医療データの標準化と生涯にわたる保存、PHRの活用の推進"]]},{"title":"2）在宅歯科医療の取り組みの促進","blocks":[["p","高齢化が進む現代において、高齢者が住み慣れた地域で自分らしい生活を続けられることを目的とした地域包括ケアシステムの実現に向けては、在宅療養者を支えるべく、在宅歯科医療の推進が欠かせない。在宅療養者共通で課題となる口腔乾燥・疼痛への対応、とくに終末期がん患者への口腔の疼痛管理への対応は、支持療法としての効果が大きく、医療の質の向上へとつながる。また、誤嚥性肺炎等の予防、低栄養などの重症化防止、認知症の進行抑制などにも歯科の寄与は大きい。"],["p","歯科における診療報酬体系のなかでは、2008（平成20）年に在宅療養支援歯科診療所が新設され、在宅歯科医療の推進が図られているところであるが、その施設基準を届け出ていない歯科診療所も含めてどのくらいが在宅歯科医療を実施しているかは、3年に1度の医療施設静態調査で把握できる。直近までの実施歯科診療所割合の推移は図表36のとおり、居宅および施設等を含め、歯科訪問診療を実施する歯科診療所割合はやや増加しているが、2017（平成29）年時点で21.8％と歯科診療所全体の約2割に過ぎない。都道府県別にみると、最小13.6%（沖縄県）から最大40.5%（長崎県）まで格差が見られる。なお、全体の傾向として、歯科訪問診療中心の歯科医療機関と、複数の歯科医師を配置し外来および訪問診療いずれも行う体制のある歯科診療所での実施件数が増えている。"],["p","要介護者すべてに何らかの在宅歯科医療サービスが月1回必要と想定した場合の充足率の推移は図表37のとおりで、2017（平成29）年時点で1割に達した程度である。"],["p","診療報酬上の「在宅療養支援歯科診療所」（歯援診）については、2008（平成20）年度の創設以来、届出件数は増加傾向にある。2018（平成30）年度診療報酬改定では歯援診の役割を明確化するとともに機能に応じた評価となるよう見直しが行われ、2つにランク分けされた。2018（平成30）年7月1日時点の届出件数は、歯援診1が606施設、歯援診2が10,655施設で、合わせて11,261施設と、歯科診療所全体の約16％にとどまっている。"],["p","在宅歯科医療を巡っては、都道府県が定める医療計画でも推進する方向性が打ち出されている。医療計画においては、2013（平成25）年度より新たに精神疾患と在宅医療を加えた「5疾病・5事業及び在宅医療」の詳細な計画を定めることになったが、策定に当たり、厚生労働省の医政局長通知（2012（平成24）年3月30日発出）で、在宅医療の中には在宅歯科医療を含むことが明記された。その結果、第6次医療計画（2013（平成25）年4月〜2018（平成30）年3月）では、すべての都道府県で在宅医療の部分に歯科に関する記載をする項目が設けられた。続く第7次医療計画（2018（平成30）年4月〜2024年3月）の策定に関しては、同じく厚労省医政局長通知（2018（平成30）年3月31日発出）で、5疾病・5事業及び在宅医療のそれぞれに係る医療連携体制として、特に必要な場合については歯科医療機関（病院歯科、歯科診療所）の役割を明記することとされた。この見直しに合わせて、同省課長通知により、目標設定するべき項目・指標のイメージとして、「訪問歯科診療を実施している歯科診療所数」「在宅療養支援歯科診療所数」が挙げられたものの、現在、すべての都道府県において数値目標を設定しているわけではない（図表38）。"],["fig","図表36歯科訪問診療を実施している歯科診療所割合の年次推移厚生労働省「医療施設調査」より日本歯科総合研究機構作成"],["fig","図表37歯科訪問診療件数を要介護者数で除した在宅歯科医療充足率厚生労働省「医療施設調査」および「介護保険事業状況報告」より日本歯科総合研究機構作成"],["p","第7次医療計画は2021年度から後半期間に入ることから、厚生労働省は有識者による検討会を立ち上げ、中間見直しの内容を議論してきた。その中で、在宅歯科医療の体制構築を進めるための指標を指標例に追加することが提起され、合意に達したところである。今後、厚生労働省の社会保障審議会医療部会で審議される予定だが、具体的な指標例としては、「在宅歯科診療に関する連携拠点数」「訪問口腔衛生指導を実施している診療所・病院数」「在宅で活躍する栄養サポートチーム（NST）と連携する歯科医療機関数」「歯科衛生士を帯同した訪問歯科診療を受けた患者数」「訪問口腔衛生指導を受けた患者数」が加わる見込みとなっている。"],["p","2022年から団塊の世代が75歳以上になり始めることを踏まえれば、在宅歯科医療を提供できる体制の整備・確保は急務であると考える。中でも、今後十数年で急速に高齢者数が増加するような地域では、在宅歯科医療に取り組む診療所のすそ野の拡大が必須となる。もとより患者が在宅療養へ移行した場合には、継続的に診療していたかかりつけ歯科医が切れ目なく歯科医療を提供することが望ましいが、現状では訪問歯科診療を行っているのは歯科診療所全体の約2割に過ぎない。この数字を向上させ、2040年までに実施率が全国平均で40％以上になることを目指す。また、在宅歯科医療の需要と提供体制には地域差が大きいことから、医療圏単位及び地域包括ケア単位で実施率の目標を設定し、地域の実情に合わせた対策を講ずる。"],["p","在宅歯科医療の推進にあたっては、診療報酬上の評価も欠かせないところである。また、在宅歯科に係る診療報酬の算定実績等を医療計画のPDCAに組み込むことによりその成果を確①在宅療養支援歯科診療所②在宅実施歯科診療所③訪問歯科診療を受けた患者数④訪問歯科衛生指導認することも重要な視点である。診療報酬の拡充に向けては、エビデンスの提示が不可欠となるため、在宅療養者に対する発症直後の口腔健康管理導入の重要性、早期の口腔リハビリテーション導入効果、生活の質の向上などに関するエビデンスの構築・収集に努めていく。"],["fig","図表38在宅医療における歯科の位置づけ（2018（平成30）年11月現在）日本歯科総合研究機構調査医療計画への位置付けのある都道府県数1．歯科に関する記載2．実施する歯科診療所リスト3．イメージ図に歯科診療所4．数値目標指標"],["p","医療計画関連では、第7次医療計画の中間見直しにおいて、いくつか在宅歯科医療の指標が追加される方向になったが、2024年度から始まる第8次医療計画では引き続き在宅歯科医療評価項目の追加や目標値記載の必須を目指す。"],["p","このほか、病院の入退院や施設の入退所時における在宅歯科医療への接続の充実に向け、在宅医療における多職種連携の基盤となる研修体制の整備を進める。"],["li","訪問歯科診療に取り組む診療所の拡大に向けた対応の強化"],["li","【2040年までに全歯科診療所の40％以上の実施率達成を目指す】"],["li","診療報酬の拡充に向けた在宅歯科医療に関するエビデンスの構築・収集"],["li","第8次医療計画における在宅歯科評価項目の追加や目標値記載の必須化に向けた働きかけ"],["li","在宅医療における多職種連携の基盤となる研修体制の整備"]]},{"title":"3）医科歯科連携をはじめとする地域医療連携の強化・推進","blocks":[["p","患者の高齢化や医療の高度化などに伴って、歯科医療においても地域の病院、医科診療所との連携の必要性は増加している。例えば、癌や心疾患など重篤な疾患の治療に際しては患者の入院前から退院後を含めた周術期の口腔機能管理が極めて重要であることが示されており、そのためには地域における医科・歯科含めた医療機関相互の連携が必須である。"],["p","2012（平成24）年度診療報酬改定で新設された周術期口腔機能管理の有効性については、医師や看護師をはじめとする医療職にも認知されつつあるが、まだ十分に活用されていない。病院歯科だけではなく地域の一般歯科診療所でも診療報酬の算定は可能であるものの、現在は医科からの依頼があってはじめて歯科介入ができる仕組みとなっていることもあり、算定しているのは病院歯科が大半で、歯科診療所は限られる。"],["p","また、高齢者の増加とともに、「病院完結型」から「地域完結型」へと軸足がシフトする中、回復期や在宅療養・介護期の摂食嚥下と栄養摂取を支援する歯科医療は重要な役割を持つ。摂食嚥下と栄養摂取などの口腔機能の管理は、生命予後に直結しかねない誤嚥性肺炎や低栄養を防ぐだけにとどまらず、長期入院患者や在宅療養患者、要介護者らの食に対する意欲を増進させることにもなるからである。しかしながら、現状では医科から歯科への連携が不十分で、歯科治療や口腔健康管理が十分に実施できていない在宅高齢者も散見される。"],["p","医科と歯科との連携が広く実践されているとは言い難い状況については、日本口腔科学会が2017（平成29）年及び2018（平成30）年に全国25病院で入院加療を行った患者約2,280人を対象に行ったアンケート調査によると、口腔内に何らかの自覚症状を有している入院患者の割合は72.2% であった。食事形態に関して、口腔状態が改善すれば希望の食事形態が達成されると考えている患者は67.5％と多いにもかかわらず、実際に入院中に歯科・口腔外科・口腔ケア外来等を受診し歯科介入を受けた患者はわずか18.2％と乖離が大きい状況である。また、退院後も歯科医療が必要な状況であるが、「かかりつけ歯科がある」との回答は46.1%にとどまり、「訪問歯科診療を知っているが利用したことがない」、「訪問歯科診療を知らない」との回答がそれぞれ50.2% および47.6% であった。"],["p","地域包括ケアシステムでは医科歯科連携に限らず、多施設・多職種との連携が重要になるものの、歯科医師は医師以外にも薬剤師、保健師、看護師、管理栄養士、理学療法士、作業療法士、言語聴覚士、社会福祉士、介護福祉士、介護支援専門員といった職種との協働が十分とは言えない。協力歯科医療機関を登録している介護施設や訪問看護師は近年では増加傾向にあるが、介護施設と連携している歯科医療機関はまだまだ少ないのが現状である。日常の生活の質向上のために上記の職種の果たす役割は大きく、日頃から口腔領域のセルフケア等を共に進めていくために連携強化を図ることが欠かせない。"],["p","医科歯科連携を進める上では、地域の拠点病院ともなっている病院の「病院歯科」が、地域内の歯科診療所と各種医療機関を結ぶ連携の窓口として機能することが、望ましい形の一つだが、歯科（歯科口腔外科を含む）を設置している病院は約2割にすぎない。2017（平成29）年医療施設調査ではその数は1,800病院だった。病院歯科は全都道府県に存在するものの、全国344の2次医療圏においては歯科の無い地域が70医療圏、歯科口腔外科が無い地域が67医療圏に上る（図表24）。"],["p","また、2020（令和2）年3月厚生局に届け出されている歯科併設病院（病院歯科）における常勤歯科医師数の分布は図表39のとおり。常勤歯科医師数が3名までの病院が約83％をこのほか、歯科医師は卒前教育や卒後臨床研修において、地域連携や多職種連携に関する講義や研修が少なく、学生や研修医が地域医療連携や多職種連携について理解する機会がないことも連携が進まない一因として指摘されている。"],["fig","図表39病院歯科における常勤歯科医師数の分布各厚生局届け出データより日本歯科総合研究機構作成占めており、ほとんどの病院歯科において少人数でその機能を担っている。したがって、病院歯科が、地域内の歯科診療所と各種医療機関を結ぶ連携の窓口として機能することにもおのずと限界がある。"],["p","病院歯科には歯科診療所の後方支援のみならず、病院内・外における医科歯科連携をより推進できる側面もあり、なおかつ臨床研修医の受け入れ先でもあることから、歯科を持つ病院が増えるよう、医科歯科連携の事例の集積やエビデンスの構築などに努める。その上で、2035年までに全国の病院の約30％に歯科が設置されていることを目指す。また、既に各所で進んでいる歯科のない中核病院をはじめとする医科医療機関と、地域歯科医師会等の地域における歯科医療関係職との連携強化も図っていく。"],["p","地域一丸となって患者を支える多職種との連携では、地域住民への様々な活動や取り組みの中で、共通の目標を定め、その対応と進捗状況を共有し、それぞれの専門性を活かしてその活動を互いに補完する必要がある。とくに運動・口腔・栄養を組み合わせた保健事業、疾病・介護予防事業は全世代にとって有益であることから、地域包括ケアシステムに沿った活動の一環として、医療、看護、介護職種だけでなく管理栄養士やリハビリ関連職種らと協働しながら、地域の病院、診療所、歯科診療所、施設、通いの場など、様々な場面で取り組みを進めていく。"],["p","多職種連携の実践にあたっては、それぞれの職種への理解を深めて意思の疎通を図るため、地域歯科医師会主催で多職種連携の研修会などを開催する。また、そうした場を活用して、多職種に対する口腔機能管理についての啓発も引き続き行っていく。"],["p","今後は、地域医療連携に精通した歯科医師養成のために地域医療連携を学ぶ臨床実習や研修を行う場として病院歯科の積極的な活用を検討すべきである。加えて、医科病院入院中の患者に対し歯科からのアプローチが制限されないような制度改正を促す。"],["li","2035年までに全国の病院の約30％に歯科が設置されることを目指す。"],["li","地域包括ケアシステムに沿った多職種及び地域の社会資源との連携強化"],["li","多職種連携に関する教育研修の充実"]]},{"title":"4）介護、障害福祉関係機関との連携強化","blocks":[["p","地域包括ケアシステムの構築を進めるとともに、地域の住民や多様な主体が支え合い、 住民一人ひとりの暮らしと生きがい、地域をともに創っていく「地域共生社会」を実現することが求められている。地域共生社会では疾病予防や健康づくりの推進による地域の活性化、疾病・介護予防や健康増進に向けた取組を自立・継続しうるものとするためには、地域資源を十分に活用し、総合的に取り組むなどして、効果的・効率的に実施することが重要である（図表"],["p","40）。"],["p","誰もが、役割と生きがいを持つ社会の醸成にむけて、地域共生社会の実現には、疾病予防や健康づくりの推進による地域の活性化も重要であり、人生100年時代を見据えて健康寿命の延伸を図るため、地域における高齢者の通いの場を中心とした、介護予防・フレイル対策（運動、口腔、栄養等）や生活習慣病などの疾病予防・重症化予防を一体的に実施する仕組みが必要であり、歯科として、歯科医療とともに健康づくり、介護予防の視点からも、今後の地域共生社会への貢献が期待されている。また、地域の実情に合った多世代・多機能型の総合的な福祉サービスの実現を目指すため、高齢者と障がい児・者が同一の事業所でサービスを受けやすくするため、2017（平成29）年度から、介護保険と障害福祉の両制度において共生型サービスが創設されている。"],["p","介護保険制度や介護サービス等における課題は、介護認定時における歯科医師の介入が不足している点、介護予防事業、歯科医師・歯科衛生士等の居宅療養管理指導などの実施割合が少ない点、介護施設などでの口腔関連サービスの充実と歯科診療所との連携推進と食支援への対応推進など多岐にわたる。また、地域共生社会を目指す中、施設・病院などから地域へ生活移行した、障がい者や医療的ケア児などへの対応を含め、障がい児・者の口腔健康管理の充実に向けて、地域福祉や病診連携などの地域連携の推進が求められる。"],["p","医療的ケア児は、医学の進歩を背景として、NICU等に長期入院した後、引き続き人工呼吸器や胃ろう等を使用し、痰の吸引や経管栄養などの医療的ケアが日常的に必要な障がい児であ今後、医療的ケア児への歯科の対応について、行政と歯科医師会との連携の推進、かかりつけ歯科医の役割の明確化、小児在宅歯科医療の推進、病院歯科、障害者歯科などとの地域歯科医療連携の推進、小児在宅医、医療的ケア児訪問看護師などとの連携が必要である。また、小児在宅歯科医療などの先進的取り組みをしている地区の状況把握とその事業の周知が望まれる。"],["fig","図表40地域共生社会とは厚生労働省「地域共生社会推進検討会」最終とりまとめ（2019年12月）より引用り、全国の医療的ケア児は約1.8万人と推計されている ［2017（平成29）年厚生労働科学研究田村班報告］。歩ける医療的ケア児から寝たきりの重度心身障がい児も含まれ、気管切開部の管理、人工呼吸器の管理、吸引、在宅酸素療法、胃瘻・腸瘻・胃管からの経管栄養、中心静脈栄養等 生きていくために日常的な医療的ケアと医療機器が必要であり、継続的な口腔健康管理と家族への支援は大変重要である。2016（平成28）年5月児童福祉法が改正され、「地方公共団体は、人工呼吸器を装着している障害児その他の日常生活を営むために医療を要する状態にある障がい児が、その心身の状況に応じた適切な保健、医療、福祉その他の各関連分野の支援を受けられるよう、保健、医療、福祉その他の各関連分野の支援を行う機関との連絡調整を行うための体制の整備に関し、必要な措置を講ずるように努めなければならない。」とされた。"],["p","今後、急増する要介護者や障がい児・者への歯科保健医療の推進のために、介護保険制度と歯科口腔関連サービスの理解と参画、連携や、地域共生社会の実現に向けての世代・全対象型地域包括支援が求められていることから、行政と地区医師会などとの連携強化のもと、都道府県歯科医師会と郡市区歯科医師会が中心となり、日常生活圏域に属する歯科診療所間の診診連携や地区口腔保健センター、障がい児・者歯科診療所、基幹病院歯科口腔外科などとの連携をさらに推進する必要がある。"],["p","また、各自治体による地域マネジメントを理解し、地域包括ケアシステムの構成要素として、その地域の医療・看護、介護・リハビリテーション、保健・福祉、介護予防・生活支援などの社会資源を把握するとともに、口腔健康管理の重要性の周知と地区歯科医師会、歯科診療所との連携推進がさらに必要である。また、多職種連携協働に向けて、地域保健医療、地域福祉にかかわる歯科専門職の人材育成とかかりつけ歯科医機能の推進が必須である。"],["li","要介護認定における歯科との連携推進【2025年まで】"],["li","地域支援事業における歯科との連携推進【2025年まで】"],["li","地域ケア会議への地区歯科医師会、歯科診療所、歯科専門職の参画の推進"],["li","介護サービスと歯科との連携と口腔領域の情報提供の推進、給付調整の明確化"],["li","認知症への対応"],["li","中重度者への食支援と歯科専門職の人材育成及び研修の充実"]]},{"title":"5）歯から始める子ども・子育て支援の拡充","blocks":[["p","我が国の年間の出生数は、第1次ベビーブーム期には約270万人、第2次ベビーブーム期には約210万人であったが、2016（平成28）年の出生数は97万6,978人と初めて100万人を割った。今後も緩やかな減少傾向が続き、2040年には74万2,170人 \\* と予測されている。（\\* 国立社会保障・人口問題研究所「日本の将来推計人口（平成29年推計）」出生中位推計）日本社会の少子化の問題は、同時に進行する人口の高齢化と相まって、生産人口が著しく減少し、日本社会の経済活力の低下を招くことである。少子化の主な原因は、非正規雇用の拡がりによる経済的な不安感、女性の高学歴化や社会進出、結婚適齢期世代の晩婚化など様々である。このような近年の社会構造の変化により、出産に至っても育児に不安感を募らせる母親が増えてきている。なかでも、産後うつの問題やひとり親家庭の抱える経済的な貧困に苛まれるケースは少なくない。経済的貧困に関連して、2018（平成30）年11月に実施した「国民健康・栄養調査」によると、歯の本数が20歯未満の者の割合は、世帯の所得が600万円以上に比較して、男女とも200万円未満と200〜600万円未満で有意に高かった。この調査結果から、所得により生活習慣や食生活には差があり、口腔の健康格差にもつながることがわかった。"],["p","2013（平成25）年6月に「子供の貧困対策の推進に関する法律」（2014（平成26）年1月施行）が成立し、2014（平成26）年8月には「子供の貧困対策に関する大綱」が策定された。また2013（平成25）年12月には「生活困窮者自立支援法」（2015（平成27）年4月施行）が制定された。貧困対策としては、多くの場合、自立につながる経済的支援だけでなく、社会的孤立を防ぎ、様々な社会資源の利用に関する格差解消に向けた取り組みが欠かせない。例えば、近年、全国で展開されてきている「子ども食堂」の取り組みは、食事の提供という生活支援だけでなく、社会的なつながりの再構築と地域との連携による課題解決の糸口となっている。"],["p","子どもに関しては、全国の児童相談所が2018（平成30）年度に対応した児童虐待の件数は15万9,850件に上り、過去最多を更新した（図表41）。虐待は、子どもへの重大な権利侵害であり、社会全体でその防止が求められている。「児童虐待の防止などに関する法律」の第5条には「歯科医師は虐待を発見しやすい立場にあることを自覚し、児童虐待の早期発見に努めなければならない」と規定されていることから、地域の歯科医師会は児童相談所や子育て世代包括支援センター等関係者と連携し、虐待の防止に関する施策の推進に積極的に協力しなければならない。"],["p","歯から始める子ども・子育て支援の拡充として、まず歯科界が取り組まなければならないのは、2019（平成31）年3月に制定された成育基本法の理念が反映されるよう、妊婦歯科健康診査の早期の法制化を目指すことである。"],["p","妊産婦に関わる歯科健康診査には集団健診方式と診療所での個別健診方式の2通りがあるが、身体的負担を考慮して、妊産婦自身が日頃から診てもらっている地域のかかりつけ歯科医による個別健診方式の方がより利用しやすいと考えられる。"],["p","妊婦に対する歯科健診については、2017（平成29）年時点で、妊娠届出を行った妊婦のうち、保健センター等において集団健診を受診した者は約7.5％、クーポン券等を配布されて歯科診療所等において個別健診を受診した者は約23.6％にとどまっている（厚生労働省「地域保健・健康増進事業報告」より）。妊娠している女性が歯周病に罹患している場合、低体重児および早産のリスクが高くなることが知られており、歯科健診の実施により、歯周病の早期発見や治療につなげていくべきである。また、出産した女性に対する産婦歯科健診も拡充を図るべきである。"],["fig","図表41児童虐待相談対応件数の推移平成30年度　児童相談所での児童虐待相談対応件数（速報値）厚生労働省"],["p","産婦は産後うつや子供の上手な育て方、離乳食に頭を悩ませがちなため、歯科健診実施ではそうしたフォローアップにも貢献する。"],["p","また、こうした妊産婦の歯科健診に関しては、パートナーの歯科健診も併せて実施する体制が望まれる。パートナー歯科健診を妊婦・産婦歯科健診と同時に展開できれば、働く世代を対象とした法定歯科健診のない現状で父親の歯科健診の機会を拡げるとともに、生まれてくる子どもの歯と口腔の健康を守るための知識を身に付けられる好機となるからだ。ほかにも、例えば産婦健診との同時実施により、父親の育児参加の有無、子供への虐待の有無、DVの可能性などを多職種でチェックできる。その結果、問題のある親子については早期に子育て世代包括支援センター等につなげられる。"],["p","近年は核家族化が進み、妊産婦の周囲に子育てを協力してくれる人がいない場合に妊産婦の孤立化の問題も存在する。若い母親は子どものころからインターネットに親しんでいた世代ということもあり、子育てに関する情報収集もインターネットに頼りがちで、スマートフォンなどで検索して知識を得ていることが少なくない。そのため、必ずしも正しい歯科口腔保健の知識が伝わっておらず、こうした若い母親に対しては、子どもの口腔の発達に応じた歯科口腔保健の普及啓発が重要と考えている。特に子どもの口腔の発達段階に応じた正しい食事の与え方、摂食・嚥下の問題などを離乳食の始まる前から教育するために、地域の栄養士会などとの協働が重要である。"],["p","生まれた子どもに目を移すと、現在の乳幼児の歯科健診事業は1歳6か月児歯科健康診査から始まるが、この段階では子どもの離乳食が既に始まっている。下顎中切歯の萌出が完了する生後1歳前後に子どもの口腔内のチェックを行う乳幼児歯科健診も必要と考える。"],["p","子どもの虐待に対する歯科的な対応としては、児童虐待の早期発見に向けた診断用アセスメントシートの開発が必要である。シートは乳幼児歯科健診事業をはじめ、保育園、幼稚園、学校等において歯科健診時に簡単に使えるものとする。このほか、児童虐待の早期発見に努める観点からは、歯科医師が子ども食堂に出向いて子どもの口腔内をチェックするなどの取り組みも進めたい。"],["p","また、地域の子育て世代包括支援センターの協議会に地域の歯科医師会がメンバーとして参画することも必要である。全国のいくつかの都道府県歯科医師会・郡市区歯科医師会が児童養護施設に歯科医師の配置を進めているが今後、こうした先行事例を横展開することが重要である。"],["li","妊産婦歯科健診の法制化に向けた対応の強化【2025年までの法制化を目指す】"],["li","児童虐待診断用アセスメントシートの開発【2025年まで】"],["li","子育て世代包括支援センターへの歯科医師、歯科衛生士の配置"],["li","【2030年までに全国展開】"],["li","1歳児歯科健診、パートナー歯科健診事業の拡充に向けた働きかけ"],["li","【2040年までに全国での実施を目指す】"]]},{"title":"6）地域歯科医師会の機能強化","blocks":[["p","地域を支える歯科医療の推進に当たり、地域歯科医師会が果たす役割は大きい。そもそも歯科医師会は、地域（郡市区、地区）歯科医師会・都道府県歯科医師会・日本歯科医師会のいわゆる三層構造からなり、それぞれ市区町村・都道府県・国の行政区分に対応する。"],["p","介護保険事業については市区町村が主体として実施されていることから、市区町村介護保険事業計画の策定等に当たっては、地域歯科医師会の代表が歯科に関する発言をしているところである。一方で、医療については、市区町村よりも、2次医療圏を中心にした広域での対応が進められてきたことから、地域歯科医師会ではなく都道府県歯科医師会の関与の方が大きく、実際、都道府県歯科医師会の代表が医療計画や地域医療構想の策定メンバーとして名を連ねている。ただ、ここ数年来、医療と介護の総合的な推進がうたわれ、住み慣れた地域で活き活きと暮らす地域包括ケアシステムの構築が進む中、地域に密着した歯科保健医療福祉の提供は急務となっており、地域歯科医師会への期待は今まで以上に高まっている。そのため地域歯科医師会の機能強化を図る必要がある。"],["p","2020（令和2）年度における厚生労働省予算には、歯科口腔保健の充実、強化を図る観点から、都道府県や保健所設置市等に加え、初めて市区町村の取組を支援するための予算が盛り込まれた。これも市町村単位でのきめ細やかな歯科保健の推進に対する期待の現われといえる。このほか、地域の歯科保健事業の充実を巡っては、消費増税分を原資とした地域医療介護総合確保基金の活用も期待される。"],["p","こうした国の予算・基金を用いて地域の歯科保健事業が確実に実行に移されるには、地域歯科医師会の発言力強化が不可欠となる。そのためには地域歯科医師会において地域の医師会や薬剤師会、看護協会との関係強化を図って、多職種連携の実績を積むことが重要である。また、地域歯科医師会と市区町村行政との連携事例を集積して、それを横展開する工夫も必要である。"],["li","厚生労働省予算や地域医療介護総合確保基金等による歯科に関する市町区事業の実施拡大に向けた働きかけ"],["li","多職種連携の実践と公表（特に医師会、薬剤師会、看護協会との連携事例）"],["li","地域歯科医師会と市区町村行政との連携事例の集積と横展開の実施"]]}]},{"title":"柱3　質が高く効率的な歯科医療提供体制を確保する","items":[{"title":"1）歯科におけるICT活用の推進","blocks":[["h4","＜現状の評価と課題＞"],["p","社会におけるICTの活用はめざましいスピードで進行している。2020（令和2）年からは「5G」（第5世代移動通信システム）のサービス提供がスタートし、高速・大容量の伝達、超高信頼・低遅延、リアルタイムな遠隔制御、多数同時接続等が可能になるなど、通信環境も著しく進歩を遂げている。"],["p","こうした状況の中、歯科医療の分野においても質の確保、医療の効率化・利便性向上からICTの活用が求められている。具体的には、地域の医療情報連携ネットワークにおける医療情報の連携に伴う本人認証、歯科医師免許証・会員証のカード化等に係るHPKI（HealthPubulicKey Infrastructure）導入や診療報酬のオンライン請求・医療保険のオンライン資格確認・電子カルテ等の請求事務関連のICT化、また患者の生涯にわたる健康管理のためのPHR（Personal Health Record）や政府が推進しているマイナポータル等があげられるが、歯科情報を含めどのように活用していくかなど課題も多い。"],["p","また歯科診療技術に関しても、光学印象技術およびCAD/CAM（コンピューター支援設計・製造）、AI診断、ロボット医療など技術革新が進行しつつあるが、実際に応用されている技術はまだ少ないのが現状である。"],["p","今後進む少子高齢社会における人口減少や、新型コロナウイルス感染症に伴う外出自粛要請等による不十分なアクセスを補うためテレビ電話やオンライン診療等のICT活用が早急に求められる。"],["p","すでに各地のモデル事業等で開始されている地域の医療情報連携ネットワークのフォーマット等を標準化して全国的に運用していく。日本歯科医師会としてHPKI等への対応を図り、各歯科医療機関が医療ネットワークに参加し、地域包括ケアを充実させていく。"],["p","個人情報の厳格な管理の下で、医療・介護における診療情報、服薬情報、健診データ等を統合して効率的で良質の医療を提供していく。データの活用やAI技術の進歩により個々人に適した歯科医療の提供や指導・管理が行われる。"],["p","国民の口腔への意識は強まっており、カメラ等によるAI画像解析を活用し、自らの口腔の健康状態を把握するようなスマートフォンアプリの開発も期待される。このような情報をかかりつけ歯科医と共有することで、口腔健康管理の質を上げることや歯科治療の必要性の判断などに活用することで、国民の安心感を高めるメリットもある。また、新型コロナウイルス感染症のような外出自粛の際には、電話やテレビ電話等を活用し、口腔健康管理を推進することが不可欠である。今後は無歯科医地区も増加することが予測され、医療機関へのアクセスや訪問診療の体制は言うまでもないが、このような地区でのICTなどを活用したオンライン診療（遠隔診療）等によるサポート体制の構築の議論を深める必要がある。"],["p","歯科の新しい技術や材料については、CAD/CAM冠の医療保険への導入以降、急速にメタルフリーへと進んでいるが、さらに新しいレジン系材料の開発やジルコニアなどの保険収載も期待される。また光学印象等の開発は今後歯科医療提供には大きな影響を与える技術であり、口腔内のデジタルデータを様々な分野と融合させて、新たなサービスや技術を推進させることなどが期待される。"],["li","診療報酬のオンライン請求の普及"],["li","【2030年までに全歯科診療所の3分の2以上が導入】"],["li","医療保険のオンライン資格確認の普及【2030年までに殆どの医療機関で】及びマイナンバーカードへの対応"],["li","地域の医療情報連携ネットワークへの参画"],["li","PHRを活用した個々の患者への対応（健康教育・予防・医療）"],["li","歯科におけるオンライン診療等、遠隔診療の検討"],["li","ICT活用による新規技術の開発促進"]]},{"title":"2）担い手（歯科衛生士・歯科技工士）の育成が進む環境の整備","blocks":[["h4","＜現状評価及び課題＞"],["p","我が国の人口動態は少子化の進展に伴い、すでに減少に転じている生産年齢人口は2025年以降さらに減少が加速する見込みで、医療保健サービスの質及び量を維持するための人材確保が喫緊の課題となっている。"],["p","歯科医療の提供においては歯科医師のみならず、歯科衛生士・歯科技工士が果たす役割は大きいものの、両職種とも養成校への受験生確保が困難な状況が続いており、実際の歯科医療現場でも人材不足が起きている。この先、生産年齢人口の減少が加速することを踏まえれば、両職種の人材確保及び人材育成に向けては早急に対策を打つ必要がある。"],["p","歯科衛生士については、歯科に対するニーズの多様化に伴い、歯科医療機関における診療の補助業務のみならず、病院や介護保険施設、行政機関での業務など活躍の場は拡がっており、就業場所や業務は更に多様化していくことが想定される。さらに、国民の健康寿命の延伸やQOLの改善のために重要な口腔健康管理の推進にとって歯科衛生士の存在は欠かせないものとなっている。"],["p","現に、新卒歯科衛生士の求人倍率は年々上昇を続けており、2018（平成30）年度には20倍を超える結果となった（図表42）。2009（平成21）年度の10.6倍と比べ、約2倍となっている。一方、歯科衛生士に対するニーズの高まりに伴い、1993（平成5）年以降、歯科衛生士養成校の入学定員は増加の一途をたどり、25年間で2倍近くになったが、入学者数は25年間で約1.5倍の増加にとどまり、定員割れの状況が続いている（図表43）。また、歯科衛生士国家試験の合格者自体は現在、年間7,000名ほどいるものの、女性が大部分を占めることにより、出産や育児等のライフイベントにより離職するケースも多いことから、復職支援策を強化する必要がある。"],["fig","図表42新卒歯科衛生士の就業者数・求人人数・求人倍率の推移歯科衛生士養成校入学定員・志願者数等の動向経年調査2019（全国歯科衛生士教育協議会）より"],["p","つまり、需要に対して就業歯科衛生士数が不足する状況が慢性化しており、今後、生産年齢人口減少が加速する中では、就業歯科衛生士数を増やすべく、歯科衛生士という職業に対する社会的認知度の向上や、歯科衛生士の確保に関する法整備が必要と考える。"],["p","次に、歯科技工士については、義歯等の歯科補綴物の活用による口腔機能の維持・向上が必要とされる高齢患者の増加により、歯科技工の分野は多様化する可能性がある。しかしながら、歯科技工士は歯科衛生士と異なり、歯科医師の診療補助業務が法律上認められていないため、業務内容は限られる。今後、歯科技工士の立場から、患者のニーズに対してきめ細やかな対応していくためには、歯科医師との緊密な連携や情報共有できるような体制を構築しておく必要がある。"],["p","歯科技工士養成学校への入学者数は1991（平成3）年の3,155人から2017（平成29）年には927人と激減し、歯科技工士養成施設数も72校から52校と20校も減少した（図表"],["p","44）。なお、ほとんどの養成施設は定員が大幅に割れているため、今後も募集停止に追い込まれる施設が出てくる可能性があり、入学希望者の減少は止まらないことが危惧される。"],["p","さらに歯科技工士に関わる問題としては、資格取得者の早期離職割合が高く（図表45）、その結果、就業歯科技工士のうち50歳以上の者が全体の50% 弱を占めるという偏った年齢階層になっている点が挙げられる。今後、高齢な就業者の退職がすすめば、歯科技工士の大幅な減少につながる恐れがあり、若手歯科技工士の確保が急務と言える。"],["fig","図表43歯科衛生士養成所の入学定員と入学者数の推移歯科衛生士養成校入学定員・志願者数等の動向経年調査2019（全国歯科衛生士教育協議会）より"],["p","将来、人口減少が進む状況下でも、現状と同等以上の歯科保健医療サービスの質と量を確保するため、医療連携・多職種連携・在宅医療等に対応できる人材確保と養成に努めていく。さらに日本歯科医師会及び歯科界は、特に小学生や中学生に対する歯科医療職種の職業告知や、その魅力について国民へアピールすると共に、歯科医療機関における労働環境の整備を進めていく。"],["p","歯科衛生士の養成については、医療介護福祉に係る多職種連携や口腔健康管理の実施に資す編入学システムの弾力的な運用、奨学金制度の充実等について改めて検討した上で、必要な措置を講ずる。さらに国に対して、歯科衛生士の確保に関する法整備を求め、それに基づき、公的登録制及び全国的なマッチングシステムを構築し、再就職時の研修等も充実させていく。また、歯科衛生士業務を補う意味で、アシスタント役を担う歯科助手に関し、各都道府県における養成研修を支援するとともに、質の向上と位置づけの検討を行う。"],["fig","図表44歯科技工士学校数と入学者の推移第7回歯科技工士の養成・確保に関する検討会より厚生労働科学研究「歯科衛生士及び歯科技工士の就業状況等に基づく安定供給方策に関する研究」より"],["fig","図表45歯科技工士を離職した年齢A校B校C校D校ｎ割合（％）ｎ割合（％）ｎ割合（％）ｎ割合（％）総数100.0100.0100.0100.020〜25歳未満51.123.555.180.025〜30歳未満28.233.823.220.030〜35歳未満8.714.711.60.035歳以上10.914.74.3無回答1.113.35.80.0色塗りは各施設における回答割合の順序（最大値：赤、最小値：白）を示しており、赤色が濃いほど高値になっている。る教育カリキュラムを充実すると共に、医療職種の各養成校との連携に基づく単位の互換性や、"],["p","歯科技工士の養成については、歯科医療における新技術開発等の成果が、教育現場に円滑に導入されることが有用であり、そのための教育体制の抜本的な改革が求められる。ただし、各養成施設は入学者の減少で危機的状況にあることから、学校存続及び施設整備のための公的助成や学生への奨学金制度の充実を、引き続き国に求めていく。併せて、今後の歯科技工士不足への対策として、ICT活用等による業務の効率化を図るべきことは言うまでもない。また一方で、日本で歯科技工士免許を取得した外国人の就労環境整備も検討することが必要である。"],["p","［歯科衛生士関連］"],["li","単位認定の拡大等による養成施設の編入学に対する弾力的運用"],["li","歯科衛生士養成施設における広報活動の拡大及び奨学金の充実"],["li","歯科衛生士の就職希望者等に対するマッチングシステムの構築"],["p","［歯科技工士関連］"],["li","歯科技工業の変化に即応できる教育カリキュラムの抜本的改革の提案"],["li","養成施設存続のための助成及び学生に対する奨学金制度の充実"],["li","歯科技工分野のICT化の推進"]]},{"title":"3）歯科界全体の活力の回復と結束強化","blocks":[["p","質が高く効率的な歯科医療提供体制の構築にあたっては、歯科界全体が活性化していることが欠かせない。活気あふれることで、新たな技術革新を呼び起こすことなどが可能となるからである。"],["p","ただし、歯科界全体の活性化を評価する指標のひとつとして「歯科医療費の動向」をみると、例えば「歯科概算医療費」は、今から約20年前からの10年程度、著しく沈滞した状況が続いていた。記録が整理されている2001（平成13年）度の2兆6000億円以降、対前年度比マイナスを繰り返し、2009（平成21）年には2兆5500億円にまで減少するという歯科医療の崩壊に繋がりかねない危機的状況が存在した（図表46）。"],["p","歯科産業界に関しては、例えば保険収載にあたって中央社会保険医療協議会（中医協）での承認が必要ないわゆる「C区分（C1、C2）新機能・新技術」とくくられる歯科医療技術についてみると、2005（平成17）年から2012（平成24）年の8年間で、中医協総会で承認を受けた件数は、医科が126件であるのに対して、歯科ではわずか1件にとどまり、技術力の面でも大きな差異が存在した。（図表47）これらの背景には、高齢化による疾病構造の変化や地域住民の生活環境の変化による歯科医療ニーズの多様化への対応が難しかったこともあるが、それらに関する情報収集・分析が不十分であったり、医療技術の進歩と密接に関わる歯科産業界の低迷等があったりした点は否めない。結果として患者のための質の高い歯科医療提供への理解と取り組みが十分に進まなかったことは重く受け止める必要がある。"],["p","今後2040年に向けての人口減少と極度の少子高齢化の課題への対応に加えて、歯科界が目指すべきことは、現在「オールデンタルの取り組み」として進めている歯科界全体の問題意識や価値観、目指す方向性の共有を更に推進することである。"],["p","そのためには、例えば現在、日本歯科医師会に設置されている「歯科活性化会議」のさらなる充実により、2040年の社会に必要な新しい歯科医療技術の議論を深めたい。特に「疾病予防」「重症化予防」の推進に向けて、歯科で立ち後れている「歯科の臨床検査」を含め、求められる新しい歯科技術を大胆にイメージし、産学官一体となっての開発を進める。更にそれらの技術を適切な評価のもとで保険収載を目指すという意識を歯科界に定着させたい。"],["p","このような方向性においては、日本歯科医学会が取り組んでいる「歯科イノベーションロードマップ」（63ページ参照）や、日本歯科商工協会が取り組んでいる「新歯科医療機器・歯科医療技術産業ビジョン」との連携も重要な視点となる。特に現在、歯科保険治療ではメタルフリー材料も増えてはいるものの、まだ全てがメタルフリー材料で対応できるには至っていない。口元の美しさは国民全てが求めるところであるとともに、現在の保険金属材料の中心である金銀パラジウム合金は価格の変動が激しいという大きな課題がある。金属に代わる材料と技術の開発について、産業界の活性化の視点からも政策的な推進を行うことが必要と考える。"],["p","この他、2040年に向けた歯科医学会、歯科産業界には、う蝕、歯周病、感染症に対する予年度C区分（新機能・新技術）医療技術の中医協承認数医科歯科H17H18H19H20H21H22H23H24合計年度歯科概算医療費医療費（兆円）伸び（億円）伸び（％）H132.60431.88H142.5945▲98▲0.38H152.5425▲520▲2.00H162.54960.28H172.57751.10H182.5057▲718▲2.79H192.5004▲53▲0.21H202.56602.63H212.5473▲187▲0.73防的機能を持った歯科材料、歯・歯周組織の再生歯科医療用器材、CAD/CAMシステムの普及に伴う材料素材や切削加工機器、付加造形システムとしての3Dプリンタ、口腔内スキャナ、OCT（Optical Coherence Tomography）画像診断装置、唾液や口腔検体を用いた全身疾患のスクリーニング機器、がんを含む口腔粘膜検診スキームなどの具体的な研究、開発課題が整理されつつある。日本歯科医師会としてはこの研究開発に協力を惜しまない。"],["fig","図表46"],["fig","図表47"],["p","またこれまで産業界で個別に対応してきた国際社会への進出、国際貢献について整理し、特にこれから高齢化が進むアジア諸国に対する貢献を一貫した政策のもとでの推進することも重要と考える。そしてそのためのグローバルの視野をもつ人材の育成をはかっていく。"],["p","これらの歯科界の結束強化においては、情報の共有、政策目標の共有が不可欠となる。これまでの「口腔の健康が全身の健康に密接に関わること」「全身の健康増進に歯科・口腔から大きな貢献が可能であること」等についての研究結果の取り纏めと政策的目標が歯科界に共有された結果、現在の歯科医療に対する国民的理解が深化してきた。一方、それを更に推進し、歯科医療政策に反映するには「マンパワーの不足」「情報収集パイプの不足」「問題意識の不足」等の課題も明らかになっている。新たな情報の収集・分析と発信を担う組織機構の整備を図り、求められる歯科医療の姿の実現に向けた政策について、恒常的なシンクタンク機能を確保することが必要である。"],["p","具体的には、情報過多の現代に適応する日本歯科総合研究機構の組織強化と共に、情報収集・分析を恒常的に行う新機構を創設し、歯科界内外を問わない人材確保、育成と登用を行う。また現在、日本歯科医師会が保有する研究結果、論文、調査結果等の各種データのデータベース化を推進し、効率的に活用できるシステム構築を行うことが重要である。また2040年代へのメインストリームである「口腔と全身疾患との関係」の解析には、まだデータが不十分なところが多いことから、学会、専門分科会や歯科大学、歯学部付属病院との連携も推進する。更に地域の実態に関する認識共有を踏まえた具体的なアクション展開が重要であり、そのために全国の好事例等に関する情報を日本歯科医師会と地域の歯科医師会で共有することを目指す、中央と地域が一体となった『歯科健康会議』の創設も検討する。"],["li","情報収集、分析とシンクタンク機能を担う新部署の展開【2025年まで】"],["li","産業界におけるメタルフリー、パラジウムフリーの歯科医療材料の積極開発への協力"],["li","【2030年まで】"],["li","論文や資料等のデータベース化による活用促進【2030年まで】"],["li","『歯科健康会議』の創設【2030年まで】"],["li","日本歯科医学会が描く歯科イノベーションの実現に向けた協力・連携【2040年まで】"],["p","日本歯科医学会作成の「歯科イノベーションロードマップ」とは日本歯科医学会は2019（令和元）年に創設70周年を記念して、2040年に向けて歯科界が未来世代の必要に応えていくための「歯科イノベーションロードマップ（工程表）」の作成に着手した。作成に当たっては、2040年の状況を予測し、そこからバックキャスティングして、課題解決のために必要なアプローチについて整理する手法を取った。具体的には、2019年から2040年を三つの期間に分けて（第1期：2019〜2025年、第2期：2026〜2032年、第3期：2033年〜2039年）、各期それぞれに開発目標を定めている。"],["p","掲げた開発テーマは三つの期間あわせて37に上る。これらのテーマは広い分野からの参加を促すため、オープンイノベーションとして様々な手段で社会に発出し、具現化を目指す。まずは2021年に日本歯科医師会とともに学会が主催する第24回日本歯科医学会学術大会において歯科界の活動テーマとして社会に示す。さらに、「いのち輝く未来社会のデザイン」のテーマもとに行われる2025年の大阪・関西万博でも、進捗状況等を含め何らかの発表をしていくことを目指している。この万博を契機に、学会は日本歯科医師会と協働して歯科医学・医療のさらなる飛躍的な展開につなげていく。"]]},{"title":"4）新規技術の導入・開発の促進と新病名の提案","blocks":[["p","歯科界では、これまで治療のほとんどをう蝕・歯周病・欠損歯の病名で完結してきたといっても過言ではない。しかし、高齢化の進展や新技術の開発とともに、これまで想定しなかった疾病構造の変化や、既存病名では対応できない口腔の問題への対応が急務となってきた。"],["p","そこで、日本歯科医師会は日本歯科医学会とともに、歯科医療技術の進歩や高齢化等による疾病構造の変化に伴い、症状に応じた適正な病名やその対応を行うべく、新しい歯科病名を模索する検討を継続してきた。2015年時点で「生活習慣性歯周病」「口腔機能低下症」「口腔機能発達不全症」「口腔バイオフィルム感染症」の4つを最優先として検討を続け、2018（平成30）年度診療報酬改定において、口腔機能低下症および口腔機能発達不全症に対する管理料が新設され、歯科疾患管理料の加算として小児口腔機能管理加算、および口腔機能管理加算が診療報酬点数として初めて評価された。また口腔機能低下症に関連する新しい検査も新設され、歯科界にとって画期的ともいえる改定となった。"],["p","ただし、国民の健康維持とQOLの確保の観点からは、患者のニーズの把握等が不足しており、意識調査などの活用が見込まれる。"],["p","新規技術の導入にあたっては、歯科産業界を中心に産・学・官連携が必須である。特に今後はう蝕、歯周病等への予防的機能を保有する歯科材料等やCAD/CAMシステムのさらなる開発、唾液や口腔検体を用いたスクリーニング機能、再生医療や歯科分野におけるバイオテクノロジーの導入を進めていく。"],["p","新病名を検討する際には、客観的かつ適切な検査による診断とそれに対応できる治療法の確立が必要不可欠である。医療保険において検査法を新設するには、エビデンスの蓄積、医療機器メーカー等による医薬品医療機器等法に規定された申請および中医協等における審査も必要となるため、さまざまな関係者との調整・連携が必要となる。"],["p","厚生労働省が示している歯科治療の将来予想（図表48）に示されているように、歯科治療の需要は歯の形態回復などの治療中心型から、口腔機能の維持・回復を目指した管理・連携型へと変化していくものと推察される今後も、従前からある歯科治療を充実させながら、将来の歯科ニーズの多様化に対応すべく、技術革新を促進するとともに、歯科関係職種が多職種と連携して、新たな管理・連携型の歯科医療へと舵を切っていく。併せて、「口腔バイオフィルム感染症」等の新たな保険病名を設定することにより、無歯顎患者や周術期患者の口腔健康管理の推進を目指す。"],["p","また、諸外国で開発された新技術に関しては、国内で実用化するためには国の承認を得る必要があるため、スムーズに導入できるよう日本歯科医師会、日本歯科医学会および産学との連携を強化する。"],["fig","図表48歯科治療の需要の将来予測厚生労働省「中央社会保険医療協議会（第376回）」資料より引用"],["li","保険収載された口腔機能低下症および発達不全症に関する管理や検査・診断の普及拡大"],["li","口腔バイオフィルム感染症に係る検査等の保険収載に向けた働きかけの強化"],["li","口腔診断・指導等へのAI・画像処理技術等の活用"],["li","再生医療等、歯科分野へのバイオテクノロジーの導入促進"],["li","世界の学術大会及び協議会等への積極的な参加"]]},{"title":"5）歯科医師の働き方改革の推進と多様なキャリアパスの提示","blocks":[["p","「働き方改革を推進するための関係法律の整備に関する法律」（通称、働き方改革関連法）が2019（令和元）年度より順次施行されている。一般企業で始まった時間外労働の上限規制は2024年4月から医師にも適用され、厚生労働省では現在、法令等の精査や、医師の負担軽減を主体としたタスク・シフト、タスク・シェアについての議論が進んでいる。大学病院の口腔外科等をはじめとして、病院勤務の歯科医師においても、医科と同様、超過勤務の実態が顕在化したため（図表49）、検討が図られている。"],["p","ただ、日本では、歯科医師の8割以上が歯科診療所で就業し、それ以外の歯科医師が病院歯科等の高次医療機関・医育機関・行政機関に勤務している現状がある。一般歯科診療所の開院時間は医科の診療所と比べて長く、長時間労働によって地域医療確保に努めていることが認められる（図表50）。また歯科医師を巡っては、女性歯科医師の割合が年々右肩上がりで増え続けており、2018（平成30）年時点で24.1％を占める（図表51）。"],["p","このような現状を踏まえると、歯科医療における働き方改革を推進するには、働く場所を問わず、また男女問わずライフイベント等により起こり得る就業形態の変化への対応、例えばフレキシブルな勤務形態の具現化などが求められる。"],["p","元より国民歯科医療推進のためには、歯科医師の健康確保や安定した就業環境が基盤となるべきであり、さらに歯科医師の養成課程を含め、新たなキャリアパスの設定、併せて不足している病院歯科医師及び行政歯科医師の増強が検討課題となっている。また、歯科医療におけるタスク・シフト、タスク・シェアについても、十分な検討を要する。"],["fig","図表49病院歯科の勤務状況"],["fig","図表50表示診療時間の割合"],["p","歯科医師の働き方改革の推進について、特に以下の3点に関して対策を講ずべきである。"],["p","第一に病院勤務の歯科医師について、医師と同様に勤務超過の状況があることから、時間外勤務の是正に向け、その法整備を求めるものである。第二に女性歯科医師の就業環境の改善に向けては、離職防止及び再就職支援を含め、女性の働き方改革に係るあらゆる施策の対象となるよう尽力していく。第三に歯科医療機関に勤務する歯科医師の労働条件の整備に向け、例えば有給休暇を取得しやすくするなど、対策を強化していく。"],["fig","図表51女性歯科医師割合"],["p","なお、歯科医療におけるタスク・シフトについては、慎重な議論に基づき、歯科衛生士による診療補助業務の拡大等、診断や処置以外の業務移管について検討の余地がある。"],["p","最後に、男女を問わず、業務分担及び業務形態の再構築、就業支援に係る検討、ICT活用による業務の効率化など、総合的に歯科医師の働き方改革を推進していく。"],["li","歯科医師としての多様なキャリアパスの提示"],["li","歯科医療におけるタスク・シフト、タスク・シェアの検討"],["li","就業支援やICT活用による業務の効率化などを通じた総合的な働き方改革の支援"]]},{"title":"6）歯科医師の資質の維持・向上に向けた教育・研修体制の強化・充実","blocks":[["p","国民に質が高い歯科医療を提供する体制を確保する大前提として、歯科医師の資質の維持・向上が求められる。その実現に当たっては、歯科大学・大学歯学部、日本歯科医師会、学会および行政が、それぞれの立場で歯科医師育成を考え、互いの連携のもと、教育制度、研修制度を強化・充実させていく必要がある。本来であれば、卒前教育、歯科医師国家試験、歯科医師臨床研修、そしてその後の生涯学習まで、一貫性を持ったシームレスな教育が欠かせないものの、まだまだ連続性が乏しいのが現状である。"],["p","大学に入学し、基礎教育から臨床実習を経て卒業し、卒業後の臨床研修に至るまでの期間については現在、文部科学省ならびに厚生労働省で、歯学教育のコアカリキュラム改訂、臨床実習に入るための共用試験の公的化とStudent Dentist（共用試験合格後の臨床実習で歯科医行為を実施する歯学生）の法的位置づけの明確化、歯科医師国家試験の見直し、歯科医師臨床研修制度の改正に向けた議論が進んでいる。日本歯科医師会としてはいずれも充実した方向になるよう積極的な提言を続けていくことが欠かせない。"],["p","卒後研修を終えた後、知識や技能のブラッシュアップとキャッチアップを支えるのが、日本歯科医師会が担当する生涯教育ということになる（図表52）。卒後において、歯科医師の医療水準を維持し良質の歯科医療を提供するには、都道府県歯科医師会および日本歯科医学会、これに属する認定分科会、専門分科会との連携した日本歯科医師会生涯研修制度の充実が極めこれまでの会員の生涯研修事業の参加率は統計を取り始めてから右肩下がりの傾向が認められる（図表53）。また一方で、生涯研修事業の単位取得ができる生涯研修セミナーの参加者数（図表54）は年度に差があるが増加傾向にある。この生涯研修セミナーはここ数年でDVD形式やライブ配信形式などより参加しやすくなるような工夫もされているため、どのような工夫や研修内容で増加傾向があるかを考察する必要がある。取得単位数に関してはこの研修システムの変化や研修会自体の認定基準の変更などで修正されている可能性もあり精査が必要である。また、生涯研修事業の参加率を増加させるための努力も必要である。"],["fig","図表52歯科医師臨床研修制度と生涯研修について厚生労働省「歯科医師の資質向上等に関する検討会（第２回）」資料より引用て重要であることは論を俟たず、日本歯科医師会では生涯研修の場と良質な研修教材の提供を進める必要がある。"],["p","併せて2040年の歯科医師像を視野に、優れた歯科医師養成のイメージを国民に提示する。優れた歯科医師養成のイメージを国民に提示するために、質の高い歯科医療提供を目指し、その認定研修を行う組織としての研修内容や研修システムの充実を図っているところである。"],["p","また、海外においても生涯研修の充実は共通の課題であり、日本歯科医師会も参加するFDI（世界歯科連盟）の年次歯科大会における各国間で協議されている。その内容は、う蝕予防をはじめ、医療技術の進歩、疾病構造の変化など多岐にわたっており、諸外国に先駆けて高齢化が進む日本の医療体制における研修制度のノウハウを提供するといった視点も重要である。"],["fig","図表53日本歯科医師会生涯研修事業参加"],["p","今後は生涯研修セミナーをより充実させ、生涯研修事業の参加率及び修了者を増加させるため、歯科界を取り巻く環境や医療体制の変化などを考慮して研修の場と研修教材の提供を行っていくことが重要である。"],["fig","図表54生涯研修セミナーの受講者数"],["p","この生涯研修事業が歯科医師の資質の向上にどの程度、寄与しているか、また、修了や認定の基準が妥当かどうか、その結果十分な知識と経験を備え、患者から信頼される専門医療を提供できる資質を有する歯科医師の育成につながっているかを絶えず検証し、今後の生涯研修の在り方について検討を加え、将来の歯科医療の変化や医療体制の変化などを予測しながらその時代のニーズに合った研修を継続していく。またこれまで2年おきの研修事業の見直しとは別に、20〜30年おきに生涯研修事業等の改革を試みてきた経緯があり、2030年を目途に新たな日本歯科医師会生涯研修制度グランドデザインを予定する。"],["p","これまでの生涯研修で培った研修制度のノウハウを他の国へ提供することも世界的視野での医療体制の構築には欠かせない。特に、超高齢社会を迎えた我が国での健康寿命の延伸に貢献するための生涯研修の内容は、これから超高齢社会を迎える国にとっては参考になると考える。"],["p","◆実現ためのアクション◆"],["li","日本歯科医師会生涯研修制度グランドデザインの策定【2030年まで】"],["li","歯学教育コアカリキュラム改訂への対応"],["li","国家試験及び臨床研修制度の見直しへの対応"],["li","日本歯科医師会認定医制度の検討"],["li","生涯研修に関する教材の海外への提供及び収集"]]},{"title":"7）日本歯科医師会の組織力強化","blocks":[["p","第1．はじめにで触れたとおり、口腔健康管理を含む歯科医療の充実は、患者、国民にとっての大きな利益につながるとともに、医療保険財政ひいては国の財政へも貢献するものである。"],["p","歯科医療の充実に向け、日本歯科医師会が果たしている役割は大きい。取り組む事業は多岐にわたるが、例えば、歯科医師の資質向上のための生涯研修事業の実施のほか、地域の歯科医師会が窓口となって行政と協力し、法定の健診事業への従事等を行っている。ほかにも、個人では限界がある、国民の健康を守るための歯科医療政策の提言を国に対して行い、実現にこぎつけている。"],["p","このように存在意義が大きい日本歯科医師会だが、組織率は右肩下がりを続け、未入会者が増加傾向にある（図表55）。現在、日本全国における歯科医師数は約10万人、そのうち日本歯科医師会の会員数は約6万5千人で、歯科医師総数に占める組織率は65％程度である。また、会員の平均年齢は61歳となっている。2014（平成26）年度の日本歯科医師会における将来シミュレーションを見ると、今後、2040年には会員数は48,347人と日本の人口とともに減少することが予想されている。また、平均年齢も徐々に高齢化が進み、2040年には会費が免除されている在籍30年以上、70歳以上の終身会員数が全会員の35％を超える予測である。"],["p","歯科医師の高齢化と未入会の歯科医師の増加には問題がある。歯科医師会会員は　地域において訪問歯科診療や歯科休日診療、地域包括ケアシステム等を支えており、担い手が不足すれば地域歯科医療提供体制に悪影響を及ぼしかねないからである。"],["p","また、歯科医師会の組織力が低下すると、政府や行政に対して臨床現場の意見が国の制度政策に反映されないことはもとより、国民の健康の維持・増進への寄与が難しくなることが懸念される。将来を見据え、日本歯科医師会の会員組織率は歯科医師全体の90％を超えている必要があると考える。"],["p","なお、都道府県別歯科医師数（医療施設従事者）と会員数は図表56のとおり。棒グラフの黄色部分は未入会者数を示しており、東京都はじめ大都市（千葉県、埼玉県、神奈川県、愛知県、大阪府、福岡県）において未入会者が多く存在する。"],["fig","図表56都道府県別歯科医師数（医療施設従事者）と日本歯科医師会会員数"],["fig","図表55日本歯科医師会の会員組織率（医療施設従事者数対比）"],["p","日本歯科医師会はじめ都道府県歯科医師会、郡市区歯科医師会では、未入会者対策にそれぞれの立場から取り組んでいるものの、いまだ組織率向上には繋がっていない。即効性のある解決策はなかなか見当たらないのが実情とはいえ、会員への迅速かつクオリティの高い情報提供、広報活動や学術研修事業の充実、日本歯科医師会福祉共済保険・年金制度によるサポート等を含め、さらなる会員支援策について検討し、能動的に提示していく必要がある。"],["p","また、組織率を上げるには、多くの会員が会の存在意義について共通認識をもてるかが極めて重要である。そのため、都道府県歯科医師会と協働し、将来を担う人材育成を進めるとともに、組織および実施事業について不断の見直しを行い、会員の負担軽減も図っていく。"],["p","新規会員を獲得する意味では、大学との連携も欠かせず、歯科医師を志す学生や臨床研修歯科医に対して入会に向けた積極的なアプローチも進める。"],["p","そもそも魅力あふれた組織でなければ、会員は増えないため、国民の健康の保持・増進に貢献している日本歯科医師会の活動を社会・国民に対して広く周知することにも努めたい。"],["li","日本歯科医師会会員に対する支援策の強化・拡充"],["li","都道府県歯科医師会及び大学等との連携による総合的な対策の実施"],["li","日本歯科医師会活動の国民への周知の強化"]]}]},{"title":"柱4　個人の予防・健康づくりをサポートする","items":[{"title":"1）総合的なヘルスケアシステム構築への関与と街づくりへの貢献","blocks":[["p","少子高齢化の進展に伴い、ライフスタイルの多様化が進むなかで、一人ひとりの個性や能力を活かし、安心して暮らせる共生社会の確立が社会課題となっている。したがって、予防から始まり、治療、栄養、運動に加え、介護、生活支援、生きがいといった生活全般や社会的な要因を視野に入れた総合的なヘルスケアの視点が重要である。生涯にわたる歯や口腔の健康を通じて、健康寿命の延伸や生活の質の向上を目指すことが歯科医療関係職種には求められている。"],["p","その上で、日常的なセルフケア、食習慣や栄養に関して必要な情報は、ライフステージに応じて変化していくので、情報を必要としている対象者に円滑に届くような健康教育や広報活動等を、地域の実情に応じて総合的に展開させる施策の検討が必要である。また、地域や個人間の健康格差の是正も課題となっているなか、医療機関等への未受診者や地域の歯科健診等に反応しない無関心層へどのようにアプローチするかが大きな課題となっている。"],["p","すでに、妊産婦健康診査等の課題にも触れたが、その後の学童期における歯科教育についても、地域による温度差があり、その実態把握が難しいことも課題である。また、就労時期における歯科健診制度も法制化されておらず、必要な歯科保健情報をどのように得るかによって個人間の口腔健康格差は広がっていく懸念がある。さらに、地域の実情に応じて、高齢者が、可能な限り、住み慣れた地域で、その有する能力に応じ自立した生活を送ることができるよう、医療・介護、介護予防、住まいなどに係わる支援の確保が、地域包括ケアシステムのなかでは基本とされているが、実際には温度差があり、課題も多い。"],["p","地域に根差した健康づくりが進めば、その地域の魅力が増して、まちづくりにも寄与することになる。歯科医療は単に歯を治すだけではなく、人が生きることを支えられる医療であり、そうした視点に基づき、地域ごとに様々な施策を総合的に展開する必要がある。"],["p","地域の中で幅広い取り組みを進めていくためには、第1に、歯科診療所が地域包括ケアネットワークの中にしっかりと位置付けられていることが重要である。それは医科歯科連携など他の医療機関、介護サービス機関、生活支援事業者などとの情報の共有や連携ができていることを意味する。患者が来てから連携先を探すのでは、連携しているとは言えない。すでに、連携先の機関とは顔の見える関係ができあがっていて、お互いの状況もよく把握しているというネットワークの上を、患者がスムーズに移動するという状況になっていなければならない。"],["p","第2に、今後、人口減少社会が到来する中で、高齢者だけではなく、さまざまな人が人の繋がりを失い、孤立する恐れがある。特に、大都市では地縁が薄く、孤立しやすく、孤立は、生活困難、健康状態の悪化などを引き起こす可能性が高い。こうした観点からもさまざまな健康支援を進めてまちづくりに貢献することが欠かせない。まちづくりは、地域包括ケアの重要な一部であると考えられる。そのためには、認知症の人も障がいのある人ない人も、高齢者も子どもも、学生も若者も、あらゆる人たちが混在し、自然に楽しく、その力を引き出し、元気と活気のある地域、あらゆる人に開かれた地域を作っていくことが重要である。このようなまちづくりの取り組みに対し、口から食べることの支援や生きがいを持って生活することの支援にも歯科診療所が役割を果たしていく必要がある。そもそも歯科診療所は患者の全身状態が健康でも継続して訪れる特性があり、あらゆる人たちの生涯を通じての健康・生活支援に努めていく。健康無関心層に対しても、地方自治体、国保、支払基金等のデータ及びNDBデータ等の活用により網羅的に情報を把握し、必要な人に必要な医療を過不足なく提供していく。"],["p","なお、国民自らが自律的に健康づくりに取り組むためには、生涯にわたる健診記録などの健康情報を一元的に管理するシステム（PHR）の構築が極めて有用である。日本歯科医師会では歯科健診データの一元化が進むよう「口腔診査情報標準コード仕様」をはじめ、生涯を通じた有効な歯科データを策定し、協力体制を整備していく。"],["li","地域包括ケアネットワークにおける、歯科医療機関の明確な位置づけの確保"],["li","歯科診療所の特性を生かした、あらゆる人たちの生涯を通じての健康・生活支援の推進"],["li","全世代にわたる歯科健診データの一元管理システム構築に向けた協力"]]},{"title":"2）新たな広報戦略の展開","blocks":[["p","人生100年時代を迎え、国民の口腔の健康に対する期待感は高まってきた。しかし生活者には、「歯科医師＝むし歯を治す」、つまり歯科医師は歯を削って詰めたり、歯が無くなれば入れ歯などを作製して補ったりするというイメージが定着している。"],["p","このため、「歯科医師は口腔健康管理をする」ことを明確にし、国民の生活を支える歯科医像を発信して、生活者が求める歯科医像と歯科医が考える歯科医像を一致させ、すべての生活者が口腔健康管理実践者となるように広報活動していくことが重要である。そして口腔健康管理の充実により、健康寿命が延伸するとともにQOLが向上、人生の最期まで自分の口でおいしく食事を取ることなど、笑顔あふれる人生を全うできるようにすることが大切な責務である。"],["p","生活者の情報源が主にテレビ、新聞、雑誌であった時代は、いかにこれらの媒体を利用して情報を受け取るだけの生活者に正しく伝えるかに重きを置いていた。だが、それでは情報のやり取りが一方通行のため、必ずしも情報が正確に伝わっていないという課題があった。インターネットが広く普及した現代は、生活者が特にスマートフォン（スマホ）を利用して情報を取りにいく時代となった。分からないことがあればすぐに検索することが可能となり、テレビや新聞から情報を得ることが少なくなりつつある。乗り物に乗っていても列をなして並んでいる時も、時間と場所を選ばず検索したり、ニュースや動画などを見たりしている。"],["p","今後、スマホによるニュースなどの閲覧時間は、ますます長くなるであろう。このスマホ滞在時間にいかに歯科の情報が食い込めるかが鍵になってくる。そのためには、生活者が知りたい情報を発信していくこと、つまり生活者に「ささる」コンテンツの作成が重要となる。コンテンツ作成においては、生活者の年代や生活様式などを加味したターゲット別の内容にするとともに、コンテンツの存在を生活者に効率よく知らせていくことが大切である。"],["p","日本歯科医師会が2018（平成30）年に行った一般生活者意識調査によると、定期的に歯科医院で口腔のチェックを受けている人は、男性より女性の方が多いものの、20〜70代までの年齢別にみると若い世代ほど少なかった。また、小さな子を持つ母親は、子どもの「しつけ」や「歯みがき、口腔衛生に関すること」に興味があるものの、十分に情報収集できていないことが明らかになった。20〜30代の女性、特に母親は家族のハブやコミュニティのハブとなっているケースが少なくなく、この世代の女性で定期チェックを受ける人が増えれば、全世代に波及していく可能性は高まると考えられる。"],["p","全体としては、日本歯科医師会の社会的役割を可視化して社会に伝えるためにも、新たなスローガンおよびビジュアル・アイデンティティの開発が急がれる。その際、日本歯科医師会の提供価値と生活者の関心が重なるところをメインメッセージにして、啓発を図っていく必要がある。"],["p","では実際に生活者に「ささる」コンテンツとは何であろうか。それを見出すには、生活者への広報活動としての目的を明確にし、施策を考え、ゴールを目指す必要がある。ゴールを実現するためには、マーケティングファネルという考え方を用い「認知」→「興味・関心」→「検討」→「行動」と区分して、効果的なPR活動を実施していく。"],["p","まずは誰に伝えるか？　つまりターゲットを設定し、その区分に適したPR活動を展開することが肝要である。そして、効果測定や測定指標を決めPDCAサイクルを回しながらブラッシュアップできる広報戦略を検討する必要がある。一般生活者意識調査や歯科疾患実態調査などからターゲットを定め、さらにデジタルを利用して、「年齢、性別、居住地、職業、役職、年収、趣味、特技、価値観、家族構成、生い立ち、休日の過ごし方、ライフスタイル」など、リアリティのある詳細な人物像を設定することが広報戦略に有用である。これにより人物像への理解が深まり、広報担当者間の認識を統一することができる。またデジタルを利用した定量データや多くの情報を基に詳細な情報まで設定すれば、生活者視点の精度を高めることができる。さらに、生活者像が明確になれば効果的なアイデアだけに絞ることもできる。"],["p","さらにターゲットの設定であるが、年代、性別、階層などで分ける必要がある。胎児の段階（マイナス1歳）から未就学児、学童期、家庭の中心となり得る子を持つ20、30代の女性、歯科健診が義務化されていない20代から40代までのビジネスマン、歯周病をはじめオーラルフレイルを見据えた50代以降の男女など、各々に詳細な人物像を設定し広報戦略を考えなければならない。"],["p","生活者に対する広報活動としては、テレビ、ラジオ、新聞、雑誌、サイネージ、シンポジウムなどの従来型のサービスに加え、インターネット、SNSなどのオンラインサービスがある。各内容の充実はもちろんのことこれらが単独、単発でなく絡み合いながらたくさんの人に接触しなければならない。前者は情報を流す一方であるが、後者は生活者が情報を取りに来る必要があるため、これを利用しながらさらにその先の従来型サービスまで取得する施策を生み出すことが重要である。そのためには生活者との接触機会の創出を目的に、プレスリリース、SNSコンテンツ、タイアップ、イベントなどを有効に利用する必要がある。"],["li","日本歯科医師会が果たす社会的役割を分かりやすく伝える"],["p","新たなスローガンおよびビジュアル・アイデンティティの策定"],["li","広報ターゲットの設定及び一体感のある広報活動の展開"],["li","既存の日歯ホームページの利用"],["p","8020テレビをはじめとするテーマパーク8020の活用"],["li","広報活動の成果を測るKPI（主要業績評価指標）の設定および検証"],["p","例：「歯科医療に関する一般生活者意識調査」における以下項目の数値向上（2018年を基準とした2025年の目標値）「定期的にチェックを受けている」（増加率年10％想定）▶全体：31.3％→61.0％　　▶20〜40代：27.8％→54.1％歯や口の中の状態が「健康だと思う」（増加率年5％想定）▶全体：42.8％→60.2％　　▶20〜40代：42.6％→59.9％"]]},{"title":"3）学校における歯科教育の充実","blocks":[["p","我が国の学校歯科保健は学校歯科医に委ねられている。学校歯科医は学校保健安全法に定められている「大学以外の学校で、歯科健康診断や歯科保健指導、歯科保健教育などの職務を非常勤で行う歯科医師」であり、歯科医師法の「歯科医師」としての身分と学校保健安全法第23条に定められた「学校歯科医」の身分を併せ持っている。その職務は、学校保健の3つの領域「保健教育」、「保健管理」、「組織活動」にまたがり、保健に関する専門職として学校関係者、児童・生徒、保護者や地域住民と連携しながら、子どもの健康づくりのために活動することになっている。"],["p","学校歯科保健の保健管理として定期歯科健康診断はすべての学校で実施され、事後措置として健康診断結果の報告と治療勧告も行っている。だが、歯科健康診断の結果を保健教育に活用し、歯科保健の特性を生かして保健教育と保健管理との調和を進めている学校は少ないのが実情である。"],["p","近年の学校歯科健康診断においては、う蝕のない子どもが増加している一方、極端にう蝕の多い子どもも少なくない
